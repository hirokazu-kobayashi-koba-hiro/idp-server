<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 620" width="1020" height="620"
     role="img" aria-label="OIDF 適合性テストの実行環境。conformance suite は idp-server にバックチャネルで直接アクセスするが、ログイン画面だけは内蔵の HtmlUnit で描画できないため URL を退避し、ホスト常駐の Playwright ドライバが実 Chromium で操作して callback に戻す。">
  <title>OIDF 適合性テストの実行環境</title>
  <desc>2 つの docker スタック（idp-server と conformance suite）と、ホストで常駐する Playwright ドライバの関係。suite 内蔵ブラウザ HtmlUnit は Next.js の CSR を描画できないため使われず、ドライバが実 Chromium でサインイン操作を肩代わりする。</desc>

  <rect x="0" y="0" width="1020" height="620" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <g font-family="system-ui, -apple-system, 'Hiragino Sans', sans-serif" fill="#0f172a">

    <text x="30" y="34" font-size="17" font-weight="600">OIDF 適合性テストの実行環境</text>
    <text x="30" y="52" font-size="11" fill="#475569">ローカル完結。certification.openid.net も ngrok も使わない。</text>

    <!-- ===== idp-server スタック ===== -->
    <rect x="30" y="70" width="340" height="250" rx="8" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="44" y="92" font-size="12" font-weight="600" fill="#475569">idp-server スタック</text>
    <text x="44" y="107" font-size="10" fill="#64748b">docker compose up -d</text>

    <rect x="50" y="118" width="300" height="44" rx="5" fill="#f1f5f9" stroke="#475569"/>
    <text x="62" y="139" font-size="12" font-weight="600">nginx :443</text>
    <text x="62" y="154" font-size="10" fill="#475569">api / mtls.api / auth  ─ .local.test</text>

    <rect x="50" y="180" width="140" height="44" rx="5" fill="#f1f5f9" stroke="#475569"/>
    <text x="120" y="200" font-size="12" text-anchor="middle" font-weight="600">idp-server</text>
    <text x="120" y="215" font-size="10" text-anchor="middle" fill="#475569">認可 / トークン</text>

    <rect x="210" y="180" width="140" height="44" rx="5" fill="#f1f5f9" stroke="#475569"/>
    <text x="280" y="200" font-size="12" text-anchor="middle" font-weight="600">app-view</text>
    <text x="280" y="215" font-size="10" text-anchor="middle" fill="#475569">Next.js CSR</text>

    <rect x="50" y="248" width="300" height="34" rx="5" fill="#f1f5f9" stroke="#475569"/>
    <text x="200" y="269" font-size="11" text-anchor="middle" fill="#475569">postgres / redis</text>

    <line x1="110" y1="162" x2="110" y2="178" stroke="#475569" marker-end="url(#arrow)"/>
    <line x1="290" y1="162" x2="290" y2="178" stroke="#475569" marker-end="url(#arrow)"/>
    <line x1="120" y1="224" x2="120" y2="246" stroke="#475569" marker-end="url(#arrow)"/>

    <!-- ===== conformance suite スタック ===== -->
    <rect x="570" y="70" width="340" height="250" rx="8" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="584" y="92" font-size="12" font-weight="600" fill="#475569">conformance suite スタック</text>
    <text x="584" y="107" font-size="10" fill="#64748b">oidc-conformance-suite/docker-compose.yaml</text>

    <rect x="590" y="118" width="300" height="44" rx="5" fill="#f1f5f9" stroke="#475569"/>
    <text x="602" y="139" font-size="12" font-weight="600">nginx :8443</text>
    <text x="602" y="154" font-size="10" fill="#475569">localhost.emobix.co.uk（network alias）</text>

    <rect x="590" y="180" width="300" height="62" rx="5" fill="#f1f5f9" stroke="#475569"/>
    <text x="602" y="198" font-size="12" font-weight="600">suite server</text>

    <rect x="602" y="206" width="112" height="26" rx="4" fill="#ffffff" stroke="#dc2626" stroke-dasharray="3 3"/>
    <text x="658" y="223" font-size="11" text-anchor="middle" fill="#dc2626">HtmlUnit</text>
    <line x1="606" y1="232" x2="710" y2="206" stroke="#dc2626" stroke-width="1.5"/>

    <text x="724" y="216" font-size="10" fill="#dc2626">CSR を描画できない</text>
    <text x="724" y="230" font-size="10" fill="#475569">→ URL を urls[] へ退避</text>

    <rect x="590" y="258" width="140" height="30" rx="5" fill="#f1f5f9" stroke="#475569"/>
    <text x="660" y="278" font-size="11" text-anchor="middle" fill="#475569">mongodb</text>

    <rect x="750" y="258" width="140" height="30" rx="5" fill="#f1f5f9" stroke="#475569"/>
    <text x="820" y="278" font-size="11" text-anchor="middle" font-weight="600">runner</text>

    <line x1="820" y1="258" x2="820" y2="244" stroke="#475569" marker-end="url(#arrow)"/>
    <text x="836" y="253" font-size="10" fill="#475569">① テスト実行</text>

    <!-- ===== バックチャネル ===== -->
    <line x1="588" y1="196" x2="354" y2="140" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="471" y="152" font-size="11" text-anchor="middle" font-weight="600">② PAR / token / userinfo</text>
    <text x="471" y="166" font-size="10" text-anchor="middle" fill="#475569">mTLS バックチャネル（ブラウザ不要）</text>

    <!-- ===== ドライバ ===== -->
    <rect x="300" y="440" width="340" height="106" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="320" y="466" font-size="13" font-weight="600" fill="#1e40af">Playwright ドライバ（ホスト常駐）</text>
    <text x="320" y="486" font-size="11" fill="#1e3a8a">実 Chromium で人間の代わりにサインインする</text>
    <text x="320" y="506" font-size="10" fill="#334155">・email OTP … 管理 API から検証コードを取得</text>
    <text x="320" y="522" font-size="10" fill="#334155">・FIDO2 … CDP の仮想オーセンティケータ（登録 / 認証）</text>
    <text x="320" y="538" font-size="10" fill="#334155">・同意 → callback へ遷移</text>

    <!-- ドライバ → idp-server -->
    <polyline points="300,480 170,480 170,322" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
    <text x="182" y="392" font-size="11" font-weight="600" fill="#1e40af">④ サインイン画面を操作</text>
    <text x="182" y="410" font-size="11" font-weight="600" fill="#1e40af">⑤ 管理 API で OTP 取得</text>

    <!-- suite → ドライバ（URL 取得） -->
    <polyline points="850,322 850,510 642,510" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
    <text x="746" y="502" font-size="11" text-anchor="middle" font-weight="600" fill="#1e40af">③ 訪問すべき URL を取得</text>
    <text x="746" y="486" font-size="10" text-anchor="middle" fill="#475569">GET /api/runner/browser/{id}</text>

    <!-- ドライバ → suite（callback） -->
    <polyline points="642,458 760,458 760,322" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
    <text x="700" y="450" font-size="11" text-anchor="middle" font-weight="600" fill="#1e40af">⑥ callback（JARM）</text>

    <text x="30" y="580" font-size="11" fill="#475569">
      ①②は suite が自分で完結できる。③〜⑥だけがドライバの仕事で、これが無いとテストは WAITING のまま 240 秒でタイムアウトする。
    </text>
    <text x="30" y="598" font-size="11" fill="#475569">
      製品コードの変更なし / suite の fork なし。suite が人間向けに公開している外部ブラウザ API をそのまま使っている。
    </text>
  </g>
</svg>
