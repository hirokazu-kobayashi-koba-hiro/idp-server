<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1310 722" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#546e7a"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828"/>
    </marker>
  </defs>

  <rect width="1310" height="722" fill="#ffffff"/>

  <text x="30" y="32" font-size="19" font-weight="bold" fill="#212121">4案の全体像 — トークンはどこにあり、画面はどこで描かれるか</text>
  <text x="30" y="54" font-size="12" fill="#616161">① トークンをどこに置くか（A / B・C / D）　　② 画面をサーバで描くか、ブラウザで組むか（B / A・C・D）</text>

  <!-- ===================== 案A ===================== -->
  <rect x="24" y="72" width="300" height="428" rx="10" fill="#fafafa" stroke="#cfd8dc"/>
  <text x="174" y="98" font-size="14" font-weight="bold" text-anchor="middle" fill="#b71c1c">案A ブラウザ直結</text>
  <text x="174" y="117" font-size="10.5" text-anchor="middle" fill="#757575">BFF なし・静的 SPA</text>

  <rect x="44" y="132" width="260" height="92" rx="8" fill="#ffebee" stroke="#c62828"/>
  <text x="59" y="155" font-size="11.5" font-weight="bold" fill="#b71c1c">ブラウザ</text>
  <rect x="59" y="165" width="230" height="30" rx="6" fill="#ffffff" stroke="#c62828"/>
  <text x="174" y="185" font-size="12" font-weight="bold" text-anchor="middle" fill="#b71c1c">アクセストークン</text>
  <text x="174" y="213" font-size="10.5" text-anchor="middle" fill="#c62828">画面もブラウザで組み立てる</text>

  <rect x="44" y="260" width="260" height="106" rx="8" fill="none" stroke="#cfd8dc" stroke-dasharray="6 5"/>
  <line x1="104" y1="224" x2="104" y2="402" stroke="#c62828" stroke-width="1.6" marker-end="url(#arrowRed)"/>
  <text x="96" y="248" font-size="10.5" text-anchor="end" fill="#c62828">Bearer</text>
  <line x1="244" y1="224" x2="244" y2="402" stroke="#546e7a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="252" y="248" font-size="10.5" fill="#546e7a">認可 / 更新</text>
  <text x="174" y="306" font-size="11" text-anchor="middle" fill="#9e9e9e">BFF なし</text>
  <text x="174" y="330" font-size="10.5" text-anchor="middle" fill="#9e9e9e">ブラウザ自身が</text>
  <text x="174" y="350" font-size="10.5" text-anchor="middle" fill="#9e9e9e">OAuth クライアント</text>

  <rect x="44" y="402" width="120" height="60" rx="8" fill="#f3e5f5" stroke="#6a1b9a"/>
  <text x="104" y="424" font-size="11" font-weight="bold" text-anchor="middle" fill="#4a148c">リソースサーバ</text>
  <text x="104" y="442" font-size="8.5" text-anchor="middle" fill="#6a1b9a">トークンを検証</text>
  <rect x="184" y="402" width="120" height="60" rx="8" fill="#e0f2f1" stroke="#00695c"/>
  <text x="244" y="424" font-size="11" font-weight="bold" text-anchor="middle" fill="#004d40">認可サーバ</text>
  <text x="244" y="442" font-size="8.5" text-anchor="middle" fill="#00695c">public クライアント</text>

  <!-- ===================== 案B ===================== -->
  <rect x="342" y="72" width="300" height="428" rx="10" fill="#fafafa" stroke="#cfd8dc"/>
  <text x="492" y="98" font-size="14" font-weight="bold" text-anchor="middle" fill="#1b5e20">案B SSR 一体型 BFF</text>
  <text x="492" y="117" font-size="10.5" text-anchor="middle" fill="#757575">Next.js が画面と BFF を兼ねる</text>

  <rect x="362" y="132" width="260" height="92" rx="8" fill="#eceff1" stroke="#78909c"/>
  <text x="377" y="155" font-size="11.5" font-weight="bold" fill="#37474f">ブラウザ</text>
  <rect x="377" y="165" width="230" height="30" rx="6" fill="#ffffff" stroke="#2e7d32"/>
  <text x="492" y="185" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#1b5e20">セッション Cookie のみ</text>
  <text x="492" y="213" font-size="10.5" text-anchor="middle" fill="#546e7a">HTML を受け取って表示する</text>

  <line x1="492" y1="224" x2="492" y2="260" stroke="#546e7a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="484" y="246" font-size="10.5" text-anchor="end" fill="#546e7a">Cookie</text>

  <rect x="362" y="260" width="260" height="106" rx="8" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="492" y="286" font-size="12" font-weight="bold" text-anchor="middle" fill="#0d47a1">サーバ（Next.js）</text>
  <text x="492" y="307" font-size="10.5" text-anchor="middle" fill="#1565c0">画面を描く ＋ BFF</text>
  <rect x="387" y="318" width="210" height="32" rx="6" fill="#ffffff" stroke="#1565c0"/>
  <text x="492" y="339" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#0d47a1">トークンを保持</text>

  <path d="M 492 366 L 492 384 L 422 384 L 422 402" fill="none" stroke="#546e7a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 492 384 L 562 384 L 562 402" fill="none" stroke="#546e7a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="414" y="380" font-size="10.5" text-anchor="end" fill="#546e7a">Bearer</text>
  <text x="570" y="380" font-size="10.5" fill="#546e7a">更新 ×1</text>

  <rect x="362" y="402" width="120" height="60" rx="8" fill="#f3e5f5" stroke="#6a1b9a"/>
  <text x="422" y="424" font-size="11" font-weight="bold" text-anchor="middle" fill="#4a148c">リソースサーバ</text>
  <text x="422" y="442" font-size="8.5" text-anchor="middle" fill="#6a1b9a">トークンを検証</text>
  <rect x="502" y="402" width="120" height="60" rx="8" fill="#e0f2f1" stroke="#00695c"/>
  <text x="562" y="424" font-size="11" font-weight="bold" text-anchor="middle" fill="#004d40">認可サーバ</text>
  <text x="562" y="442" font-size="8.5" text-anchor="middle" fill="#00695c">更新はロックで1本</text>

  <!-- ===================== 案C ===================== -->
  <rect x="660" y="72" width="300" height="428" rx="10" fill="#fafafa" stroke="#cfd8dc"/>
  <text x="810" y="98" font-size="14" font-weight="bold" text-anchor="middle" fill="#1b5e20">案C SPA + 独立 BFF</text>
  <text x="810" y="117" font-size="10.5" text-anchor="middle" fill="#757575">トークンはサーバのストアに置く</text>

  <rect x="680" y="132" width="260" height="92" rx="8" fill="#eceff1" stroke="#78909c"/>
  <text x="695" y="155" font-size="11.5" font-weight="bold" fill="#37474f">ブラウザ</text>
  <rect x="695" y="165" width="230" height="30" rx="6" fill="#ffffff" stroke="#2e7d32"/>
  <text x="810" y="185" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#1b5e20">セッション Cookie のみ</text>
  <text x="810" y="213" font-size="10.5" text-anchor="middle" fill="#ef6c00">画面はブラウザで組み立てる</text>

  <line x1="740" y1="224" x2="740" y2="260" stroke="#546e7a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="732" y="246" font-size="10.5" text-anchor="end" fill="#546e7a">画面</text>
  <line x1="880" y1="224" x2="880" y2="260" stroke="#546e7a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="872" y="246" font-size="10.5" text-anchor="end" fill="#546e7a">Cookie</text>

  <rect x="680" y="260" width="120" height="106" rx="8" fill="#eceff1" stroke="#78909c"/>
  <text x="740" y="288" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#37474f">S3</text>
  <text x="740" y="310" font-size="10" text-anchor="middle" fill="#607d8b">SPA を配信</text>
  <text x="740" y="328" font-size="10" text-anchor="middle" fill="#607d8b">（静的）</text>

  <rect x="820" y="260" width="120" height="106" rx="8" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="880" y="286" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#0d47a1">BFF</text>
  <text x="880" y="306" font-size="10" text-anchor="middle" fill="#1565c0">ストアあり</text>
  <rect x="832" y="318" width="96" height="32" rx="6" fill="#ffffff" stroke="#1565c0"/>
  <text x="880" y="339" font-size="10" font-weight="bold" text-anchor="middle" fill="#0d47a1">トークン保持</text>

  <path d="M 880 366 L 880 384 L 740 384 L 740 402" fill="none" stroke="#546e7a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 880 384 L 880 402" fill="none" stroke="#546e7a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="732" y="380" font-size="10.5" text-anchor="end" fill="#546e7a">Bearer</text>
  <text x="888" y="380" font-size="10.5" fill="#546e7a">更新 ×1</text>

  <rect x="680" y="402" width="120" height="60" rx="8" fill="#f3e5f5" stroke="#6a1b9a"/>
  <text x="740" y="424" font-size="11" font-weight="bold" text-anchor="middle" fill="#4a148c">リソースサーバ</text>
  <text x="740" y="442" font-size="8.5" text-anchor="middle" fill="#6a1b9a">トークンを検証</text>
  <rect x="820" y="402" width="120" height="60" rx="8" fill="#e0f2f1" stroke="#00695c"/>
  <text x="880" y="424" font-size="11" font-weight="bold" text-anchor="middle" fill="#004d40">認可サーバ</text>
  <text x="880" y="442" font-size="8.5" text-anchor="middle" fill="#00695c">更新はロックで1本</text>

  <!-- ===================== 案D ===================== -->
  <rect x="978" y="72" width="300" height="428" rx="10" fill="#fafafa" stroke="#cfd8dc"/>
  <text x="1128" y="98" font-size="14" font-weight="bold" text-anchor="middle" fill="#e65100">案D SPA + ステートレス BFF</text>
  <text x="1128" y="117" font-size="10.5" text-anchor="middle" fill="#757575">トークンは暗号化 Cookie に載せる</text>

  <rect x="998" y="132" width="260" height="92" rx="8" fill="#fff8e1" stroke="#ef6c00"/>
  <text x="1013" y="155" font-size="11.5" font-weight="bold" fill="#e65100">ブラウザ</text>
  <rect x="1013" y="165" width="230" height="30" rx="6" fill="#ffffff" stroke="#ef6c00"/>
  <text x="1128" y="185" font-size="11" font-weight="bold" text-anchor="middle" fill="#e65100">暗号化トークン入り Cookie</text>
  <text x="1128" y="213" font-size="10.5" text-anchor="middle" fill="#ef6c00">JS からは読めない（HttpOnly）</text>

  <line x1="1058" y1="224" x2="1058" y2="260" stroke="#546e7a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="1050" y="246" font-size="10.5" text-anchor="end" fill="#546e7a">画面</text>
  <line x1="1192" y1="224" x2="1192" y2="260" stroke="#c62828" stroke-width="1.6" marker-end="url(#arrowRed)"/>
  <line x1="1198" y1="224" x2="1198" y2="260" stroke="#c62828" stroke-width="1.6" marker-end="url(#arrowRed)"/>
  <line x1="1204" y1="224" x2="1204" y2="260" stroke="#c62828" stroke-width="1.6" marker-end="url(#arrowRed)"/>
  <text x="1184" y="246" font-size="10.5" text-anchor="end" font-weight="bold" fill="#c62828">並列 API</text>

  <rect x="998" y="260" width="120" height="106" rx="8" fill="#eceff1" stroke="#78909c"/>
  <text x="1058" y="288" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#37474f">S3</text>
  <text x="1058" y="310" font-size="10" text-anchor="middle" fill="#607d8b">SPA を配信</text>
  <text x="1058" y="328" font-size="10" text-anchor="middle" fill="#607d8b">（静的）</text>

  <rect x="1138" y="260" width="120" height="106" rx="8" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="1198" y="286" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#0d47a1">BFF</text>
  <text x="1198" y="306" font-size="10" text-anchor="middle" fill="#c62828">ロックの置き場所なし</text>
  <rect x="1150" y="318" width="96" height="32" rx="6" fill="#ffffff" stroke="#ef6c00"/>
  <text x="1198" y="339" font-size="10" font-weight="bold" text-anchor="middle" fill="#e65100">ストアなし</text>

  <path d="M 1198 366 L 1198 384 L 1058 384 L 1058 402" fill="none" stroke="#546e7a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 1192 384 L 1192 402" fill="none" stroke="#c62828" stroke-width="1.6" marker-end="url(#arrowRed)"/>
  <path d="M 1198 384 L 1198 402" fill="none" stroke="#c62828" stroke-width="1.6" marker-end="url(#arrowRed)"/>
  <path d="M 1204 384 L 1204 402" fill="none" stroke="#c62828" stroke-width="1.6" marker-end="url(#arrowRed)"/>
  <text x="1050" y="380" font-size="10.5" text-anchor="end" fill="#546e7a">Bearer</text>
  <text x="1212" y="380" font-size="10.5" font-weight="bold" fill="#c62828">更新 ×N</text>

  <rect x="998" y="402" width="120" height="60" rx="8" fill="#f3e5f5" stroke="#6a1b9a"/>
  <text x="1058" y="424" font-size="11" font-weight="bold" text-anchor="middle" fill="#4a148c">リソースサーバ</text>
  <text x="1058" y="442" font-size="8.5" text-anchor="middle" fill="#6a1b9a">トークンを検証</text>
  <rect x="1138" y="402" width="120" height="60" rx="8" fill="#ffebee" stroke="#c62828"/>
  <text x="1198" y="422" font-size="11" font-weight="bold" text-anchor="middle" fill="#b71c1c">認可サーバ</text>
  <text x="1198" y="438" font-size="8.5" text-anchor="middle" fill="#c62828">同じ RT で N 回</text>
  <text x="1198" y="452" font-size="8.5" text-anchor="middle" fill="#c62828">再利用検知で全破棄</text>

  <!-- ===================== まとめ帯 ===================== -->
  <rect x="24" y="520" width="300" height="182" rx="10" fill="#ffffff" stroke="#ef9a9a"/>
  <text x="44" y="546" font-size="11.5" font-weight="bold" fill="#b71c1c">そのぶん何が変わるか</text>
  <text x="44" y="574" font-size="10.5" fill="#c62828">✗ アクセストークンが XSS で盗まれる</text>
  <text x="44" y="596" font-size="10.5" fill="#c62828">✗ 隠し iframe で新規取得（§5.1.3）</text>
  <text x="44" y="618" font-size="10.5" fill="#2e7d32">○ CSRF は起きない（Cookie 不使用）</text>
  <text x="44" y="640" font-size="10.5" fill="#ef6c00">△ 即時失効は実装次第</text>
  <text x="44" y="662" font-size="10.5" fill="#c62828">✗ 画面データもすべてブラウザに出る</text>
  <text x="44" y="684" font-size="10.5" fill="#c62828">✗ メモリ保存だとリロードで消える</text>

  <rect x="342" y="520" width="300" height="182" rx="10" fill="#ffffff" stroke="#a5d6a7"/>
  <text x="362" y="546" font-size="11.5" font-weight="bold" fill="#1b5e20">そのぶん何が変わるか</text>
  <text x="362" y="574" font-size="10.5" fill="#2e7d32">○ トークンはブラウザに存在しない</text>
  <text x="362" y="596" font-size="10.5" fill="#2e7d32">○ §5.1.3 も塞がる（confidential）</text>
  <text x="362" y="618" font-size="10.5" fill="#ef6c00">△ CSRF 対策が必須</text>
  <text x="362" y="640" font-size="10.5" fill="#2e7d32">○ 即時失効できる（ストア保持）</text>
  <text x="362" y="662" font-size="10.5" fill="#2e7d32">○ 画面データをサーバに留められる</text>
  <text x="362" y="684" font-size="10.5" fill="#2e7d32">○ リロード往復なし・更新はロック可</text>

  <rect x="660" y="520" width="300" height="182" rx="10" fill="#ffffff" stroke="#a5d6a7"/>
  <text x="680" y="546" font-size="11.5" font-weight="bold" fill="#1b5e20">そのぶん何が変わるか</text>
  <text x="680" y="574" font-size="10.5" fill="#2e7d32">○ トークンはブラウザに存在しない</text>
  <text x="680" y="596" font-size="10.5" fill="#2e7d32">○ §5.1.3 も塞がる（confidential）</text>
  <text x="680" y="618" font-size="10.5" fill="#ef6c00">△ CSRF 対策が必須</text>
  <text x="680" y="640" font-size="10.5" fill="#2e7d32">○ 即時失効できる（ストア保持）</text>
  <text x="680" y="662" font-size="10.5" fill="#ef6c00">△ 画面データは API 経由で出る</text>
  <text x="680" y="684" font-size="10.5" fill="#ef6c00">△ リロードは1往復・更新はロック可</text>

  <rect x="978" y="520" width="300" height="182" rx="10" fill="#ffffff" stroke="#ffcc80"/>
  <text x="998" y="546" font-size="11.5" font-weight="bold" fill="#e65100">そのぶん何が変わるか</text>
  <text x="998" y="574" font-size="10.5" fill="#ef6c00">△ トークンはブラウザ上（HttpOnly）</text>
  <text x="998" y="596" font-size="10.5" fill="#2e7d32">○ §5.1.3 も塞がる（confidential）</text>
  <text x="998" y="618" font-size="10.5" fill="#ef6c00">△ CSRF 対策が必須</text>
  <text x="998" y="640" font-size="10.5" fill="#c62828">✗ 即時失効できない・Cookie 4KB 制約</text>
  <text x="998" y="662" font-size="10.5" fill="#ef6c00">△ 画面データは API 経由で出る</text>
  <text x="998" y="684" font-size="10.5" fill="#c62828">✗ 並列 API で更新が多重発火（ロック不可）</text>
</svg>
