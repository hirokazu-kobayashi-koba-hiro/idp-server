<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 760" font-family="'Helvetica Neue', Arial, 'Hiragino Sans', 'Noto Sans JP', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="760" fill="#ffffff"/>

  <!-- title -->
  <text x="490" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0F172A">Attestation-Based Client Authentication の全体像</text>
  <text x="490" y="54" text-anchor="middle" font-size="12" fill="#64748B">draft-ietf-oauth-attestation-based-client-auth — 2つの JWT でクライアントインスタンスを認証する</text>

  <!-- actors -->
  <rect x="40" y="70" width="270" height="56" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="175" y="93" text-anchor="middle" font-size="15" font-weight="bold" fill="#312E81">Client Attester</text>
  <text x="175" y="112" text-anchor="middle" font-size="11" fill="#4338CA">アプリのバックエンド等（Attestation の発行側）</text>

  <rect x="355" y="70" width="270" height="56" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.5"/>
  <text x="490" y="93" text-anchor="middle" font-size="15" font-weight="bold" fill="#134E4A">Client Instance</text>
  <text x="490" y="112" text-anchor="middle" font-size="11" fill="#0F766E">モバイルアプリ＝端末上のひとつのインストール</text>

  <rect x="670" y="70" width="270" height="56" rx="8" fill="#FFF7ED" stroke="#D97706" stroke-width="1.5"/>
  <text x="805" y="93" text-anchor="middle" font-size="15" font-weight="bold" fill="#7C2D12">Authorization Server</text>
  <text x="805" y="112" text-anchor="middle" font-size="11" fill="#B45309">検証側（トークンエンドポイント等）</text>

  <!-- lifelines -->
  <line x1="175" y1="126" x2="175" y2="700" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="490" y1="126" x2="490" y2="700" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="805" y1="126" x2="805" y2="700" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- step 1: generate CIK -->
  <rect x="380" y="142" width="220" height="44" rx="6" fill="#ffffff" stroke="#0D9488" stroke-width="1.2"/>
  <text x="490" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#134E4A">① CIK（Client Instance Key）を生成</text>
  <text x="490" y="177" text-anchor="middle" font-size="11" fill="#0F766E">秘密鍵は端末の TEE / Secure Enclave 等に保管</text>

  <!-- step 2: verify app -->
  <line x1="482" y1="212" x2="184" y2="212" stroke="#334155" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="333" y="202" text-anchor="middle" font-size="12" font-weight="bold" fill="#0F172A">② アプリの正当性の確認を受ける</text>
  <text x="333" y="228" text-anchor="middle" font-size="11" fill="#64748B">（platform attestation 等 — 確認方式は仕様のスコープ外）</text>

  <!-- step 3: issue CAJ -->
  <line x1="184" y1="256" x2="482" y2="256" stroke="#334155" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="333" y="247" text-anchor="middle" font-size="12" font-weight="bold" fill="#0F172A">③ Client Attestation JWT（CAJ）を発行</text>

  <!-- CAJ box -->
  <rect x="60" y="276" width="320" height="122" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
  <text x="220" y="298" text-anchor="middle" font-size="12" font-weight="bold" fill="#312E81">Client Attestation JWT — Attester の鍵で署名</text>
  <text x="76" y="320" font-size="12" font-family="monospace" fill="#1E293B">typ: oauth-client-attestation+jwt</text>
  <text x="76" y="340" font-size="12" font-family="monospace" fill="#1E293B">sub: client_id</text>
  <text x="76" y="360" font-size="12" font-family="monospace" fill="#1E293B">exp: 有効期限</text>
  <text x="76" y="380" font-size="12" font-family="monospace" fill="#B91C1C">cnf: { "jwk": CIK の公開鍵 }</text>

  <!-- step 4: sign PoP -->
  <rect x="380" y="418" width="260" height="30" rx="6" fill="#ffffff" stroke="#0D9488" stroke-width="1.2"/>
  <text x="510" y="438" text-anchor="middle" font-size="12" font-weight="bold" fill="#134E4A">④ リクエスト毎に PoP JWT を CIK で署名</text>

  <!-- PoP box -->
  <rect x="380" y="458" width="320" height="122" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.2"/>
  <text x="540" y="480" text-anchor="middle" font-size="12" font-weight="bold" fill="#134E4A">Client Attestation PoP JWT — CIK で署名</text>
  <text x="396" y="502" font-size="12" font-family="monospace" fill="#1E293B">typ: oauth-client-attestation-pop+jwt</text>
  <text x="396" y="522" font-size="12" font-family="monospace" fill="#1E293B">aud: AS の issuer identifier URL</text>
  <text x="396" y="542" font-size="12" font-family="monospace" fill="#1E293B">jti: 一意な識別子 ／ iat: 発行時刻</text>
  <text x="396" y="562" font-size="12" font-family="monospace" fill="#64748B">challenge: サーバー発行チャレンジ（任意）</text>

  <!-- step 5: send headers -->
  <line x1="498" y1="612" x2="796" y2="612" stroke="#334155" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="647" y="596" text-anchor="middle" font-size="12" font-weight="bold" fill="#0F172A">⑤ 2つの HTTP ヘッダで送信（それぞれ厳密に1つ）</text>
  <text x="647" y="628" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#334155">OAuth-Client-Attestation: &lt;CAJ&gt;</text>
  <text x="647" y="643" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#334155">OAuth-Client-Attestation-PoP: &lt;PoP&gt;</text>

  <!-- step 6: verification -->
  <rect x="660" y="656" width="290" height="96" rx="8" fill="#FFF7ED" stroke="#D97706" stroke-width="1.2"/>
  <text x="676" y="676" font-size="12" font-weight="bold" fill="#7C2D12">⑥ 検証（Authorization Server）</text>
  <text x="676" y="695" font-size="11.5" fill="#1E293B">1. CAJ の署名を信頼する Attester 鍵で検証</text>
  <text x="676" y="712" font-size="11.5" fill="#1E293B">2. CAJ から cnf.jwk（CIK 公開鍵）を取得</text>
  <text x="676" y="729" font-size="11.5" fill="#1E293B">3. PoP の署名を cnf.jwk で検証</text>
  <text x="676" y="746" font-size="11.5" font-weight="bold" fill="#15803D">→ client_id のインスタンスとして認証成立</text>

  <!-- trust chain -->
  <text x="40" y="672" font-size="12" font-weight="bold" fill="#0F172A">信頼の連鎖</text>
  <rect x="40" y="682" width="170" height="40" rx="6" fill="#F8FAFC" stroke="#64748B" stroke-width="1"/>
  <text x="125" y="698" text-anchor="middle" font-size="11" fill="#1E293B">Attester の鍵を</text>
  <text x="125" y="713" text-anchor="middle" font-size="11" fill="#1E293B">事前に信頼</text>
  <line x1="210" y1="702" x2="238" y2="702" stroke="#334155" stroke-width="1.4" marker-end="url(#arrow)"/>
  <rect x="240" y="682" width="190" height="40" rx="6" fill="#F8FAFC" stroke="#64748B" stroke-width="1"/>
  <text x="335" y="698" text-anchor="middle" font-size="11" fill="#1E293B">CAJ が cnf.jwk（CIK）を</text>
  <text x="335" y="713" text-anchor="middle" font-size="11" fill="#1E293B">client_id に紐づけて保証</text>
  <line x1="430" y1="702" x2="458" y2="702" stroke="#334155" stroke-width="1.4" marker-end="url(#arrow)"/>
  <rect x="460" y="682" width="180" height="40" rx="6" fill="#F8FAFC" stroke="#64748B" stroke-width="1"/>
  <text x="550" y="698" text-anchor="middle" font-size="11" fill="#1E293B">PoP が CIK の所持を</text>
  <text x="550" y="713" text-anchor="middle" font-size="11" fill="#1E293B">リクエスト毎に証明</text>
</svg>
