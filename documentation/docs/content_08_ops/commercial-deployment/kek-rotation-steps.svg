<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans JP', sans-serif">
  <title>KEK の交換の手順</title>
  <desc>交換前から古い KEK を外すまでの 4 段階と、それぞれの設定、次の段階へ進む条件、失敗したときの戻り方</desc>

  <rect width="980" height="470" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a94a0"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b04a4a"/>
    </marker>
  </defs>

  <text x="24" y="34" font-size="15" font-weight="700" fill="#1a1a1a">KEK を default から k2026 へ替える</text>

  <!-- ── stage cards (x = 24, 220, 416, 612, 808; w = 148) ── -->
  <!-- stage 0 -->
  <g>
    <rect x="24" y="56" width="148" height="176" rx="10" fill="#f4f6f9" stroke="#c8cdd4"/>
    <text x="98" y="82" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">交換前</text>
    <text x="38" y="110" font-size="10" fill="#5a6470">ENCRYPTION_KEYS</text>
    <text x="38" y="128" font-size="12" font-weight="700" fill="#1a1a1a">default</text>
    <text x="38" y="154" font-size="10" fill="#5a6470">ACTIVE_KEY_ID</text>
    <text x="38" y="172" font-size="12" font-weight="700" fill="#1a1a1a">default</text>
  </g>
  <!-- stage 1 -->
  <g>
    <rect x="220" y="56" width="148" height="176" rx="10" fill="#eef2f7" stroke="#c8cdd4"/>
    <text x="294" y="82" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">1. passive で配る</text>
    <text x="234" y="110" font-size="10" fill="#5a6470">ENCRYPTION_KEYS</text>
    <text x="234" y="128" font-size="12" font-weight="700" fill="#7a5a2a">k2026, default</text>
    <text x="234" y="154" font-size="10" fill="#5a6470">ACTIVE_KEY_ID</text>
    <text x="234" y="172" font-size="12" font-weight="700" fill="#1a1a1a">default</text>
    <text x="234" y="206" font-size="10.5" fill="#5a6470">全台が k2026 を</text>
    <text x="234" y="222" font-size="10.5" fill="#5a6470">開ける状態にする</text>
  </g>
  <!-- stage 2 -->
  <g>
    <rect x="416" y="56" width="148" height="176" rx="10" fill="#eef2f7" stroke="#c8cdd4"/>
    <text x="490" y="82" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">2. active にする</text>
    <text x="430" y="110" font-size="10" fill="#5a6470">ENCRYPTION_KEYS</text>
    <text x="430" y="128" font-size="12" font-weight="700" fill="#1a1a1a">k2026, default</text>
    <text x="430" y="154" font-size="10" fill="#5a6470">ACTIVE_KEY_ID</text>
    <text x="430" y="172" font-size="12" font-weight="700" fill="#7a5a2a">k2026</text>
    <text x="430" y="206" font-size="10.5" fill="#5a6470">新しい DEK は</text>
    <text x="430" y="222" font-size="10.5" fill="#5a6470">k2026 で包まれる</text>
  </g>
  <!-- stage 3 -->
  <g>
    <rect x="612" y="56" width="148" height="176" rx="10" fill="#eef2f7" stroke="#c8cdd4"/>
    <text x="686" y="82" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">3. 包み直す</text>
    <text x="626" y="110" font-size="10" fill="#5a6470">設定</text>
    <text x="626" y="128" font-size="12" font-weight="700" fill="#1a1a1a">2 のまま</text>
    <text x="626" y="154" font-size="10" fill="#5a6470">呼ぶ API</text>
    <text x="626" y="172" font-size="11" font-weight="700" fill="#1a1a1a">data-keys/rewrap</text>
    <text x="626" y="206" font-size="9.5" fill="#5a6470">expected_active_key_id</text>
    <text x="626" y="222" font-size="10.5" fill="#5a6470">= k2026 を付ける</text>
  </g>
  <!-- stage 4 -->
  <g>
    <rect x="808" y="56" width="148" height="176" rx="10" fill="#eef2f7" stroke="#c8cdd4"/>
    <text x="882" y="82" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">4. 古い KEK を外す</text>
    <text x="822" y="110" font-size="10" fill="#5a6470">ENCRYPTION_KEYS</text>
    <text x="822" y="128" font-size="12" font-weight="700" fill="#7a5a2a">k2026</text>
    <text x="822" y="154" font-size="10" fill="#5a6470">ACTIVE_KEY_ID</text>
    <text x="822" y="172" font-size="12" font-weight="700" fill="#1a1a1a">k2026</text>
    <text x="822" y="206" font-size="10.5" fill="#5a6470">外した default の値は</text>
    <text x="822" y="222" font-size="10.5" fill="#5a6470">捨てずに保管する</text>
  </g>

  <!-- ── arrows between stages ──────────────────────────── -->
  <path d="M 172 144 L 218 144" stroke="#8a94a0" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 368 144 L 414 144" stroke="#8a94a0" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 564 144 L 610 144" stroke="#8a94a0" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 760 144 L 806 144" stroke="#8a94a0" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- ── gates ──────────────────────────────────────────── -->
  <text x="24" y="270" font-size="12" font-weight="700" fill="#1a1a1a">進む条件</text>
  <line x1="392" y1="144" x2="392" y2="282" stroke="#8fbfa3" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="588" y1="144" x2="588" y2="282" stroke="#8fbfa3" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="784" y1="144" x2="784" y2="282" stroke="#8fbfa3" stroke-width="2" stroke-dasharray="4 3"/>

  <g>
    <rect x="322" y="282" width="140" height="44" rx="8" fill="#e6f2ea" stroke="#8fbfa3"/>
    <text x="392" y="301" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1f5c3d">全台がこの設定</text>
    <text x="392" y="317" font-size="10.5" text-anchor="middle" fill="#337050">デプロイが終わった</text>
  </g>
  <g>
    <rect x="518" y="282" width="140" height="44" rx="8" fill="#e6f2ea" stroke="#8fbfa3"/>
    <text x="588" y="301" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1f5c3d">全台がこの設定</text>
    <text x="588" y="317" font-size="10.5" text-anchor="middle" fill="#337050">デプロイが終わった</text>
  </g>
  <g>
    <rect x="714" y="282" width="140" height="44" rx="8" fill="#e6f2ea" stroke="#8fbfa3"/>
    <text x="784" y="301" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1f5c3d">pending_rewrap = 0</text>
    <text x="784" y="317" font-size="10.5" text-anchor="middle" fill="#337050">全台の入れ替え後に再確認</text>
  </g>
  <g>
    <rect x="862" y="282" width="94" height="44" rx="8" fill="#e6f2ea" stroke="#8fbfa3"/>
    <text x="909" y="301" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1f5c3d">完了</text>
    <text x="909" y="317" font-size="10.5" text-anchor="middle" fill="#337050">unopenable = 0</text>
  </g>
  <line x1="909" y1="232" x2="909" y2="282" stroke="#8fbfa3" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- ── when it goes wrong ─────────────────────────────── -->
  <text x="24" y="368" font-size="12" font-weight="700" fill="#1a1a1a">うまくいかないとき</text>
  <g>
    <rect x="416" y="352" width="344" height="52" rx="8" fill="#f7ecec" stroke="#d9a5a5"/>
    <text x="430" y="374" font-size="11.5" font-weight="700" fill="#8c2f2f">rewrap が 409</text>
    <text x="430" y="393" font-size="10.5" fill="#8c2f2f">応答した台の active が違う。2 に戻り全台をそろえる</text>
  </g>
  <path d="M 490 352 L 490 236" stroke="#b04a4a" stroke-width="2" fill="none" marker-end="url(#arrow-red)"/>

  <g>
    <rect x="612" y="414" width="344" height="44" rx="8" fill="#f7ecec" stroke="#d9a5a5"/>
    <text x="626" y="433" font-size="11.5" font-weight="700" fill="#8c2f2f">外した後に unopenable が 0 でない</text>
    <text x="626" y="450" font-size="10.5" fill="#8c2f2f">外した KEK を ENCRYPTION_KEYS に戻して、3 から続ける</text>
  </g>
</svg>
