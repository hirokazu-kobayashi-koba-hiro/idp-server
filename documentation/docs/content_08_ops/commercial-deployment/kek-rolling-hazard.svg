<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" width="980" height="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans JP', sans-serif">
  <title>新しい KEK をいきなり active にしたとき</title>
  <desc>ローリングデプロイの途中で、新しい設定の台が新しい KEK で包んだデータ鍵を、まだ古い設定の台が開けない様子</desc>

  <rect width="980" height="330" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a94a0"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b04a4a"/>
    </marker>
  </defs>

  <text x="32" y="36" font-size="15" font-weight="700" fill="#1a1a1a">ローリングデプロイの途中で、いきなり k2026 を active にした場合</text>

  <!-- new server -->
  <g>
    <rect x="32" y="62" width="250" height="132" rx="10" fill="#eef2f7" stroke="#c8cdd4"/>
    <text x="48" y="88" font-size="13" font-weight="700" fill="#1a1a1a">新しい設定の台</text>
    <rect x="48" y="102" width="218" height="34" rx="6" fill="#f7f0e6" stroke="#d8c4a0"/>
    <text x="60" y="124" font-size="11" fill="#1a1a1a">KEYS：k2026, default</text>
    <rect x="48" y="144" width="218" height="34" rx="6" fill="#f7f0e6" stroke="#d8c4a0"/>
    <text x="60" y="166" font-size="11" fill="#1a1a1a">ACTIVE：k2026</text>
  </g>

  <!-- database -->
  <g>
    <rect x="365" y="62" width="250" height="132" rx="10" fill="#f4f6f9" stroke="#c8cdd4"/>
    <text x="381" y="88" font-size="13" font-weight="700" fill="#1a1a1a">tenant_data_keys</text>
    <rect x="381" y="102" width="218" height="76" rx="6" fill="#ffffff" stroke="#c8cdd4"/>
    <text x="393" y="124" font-size="12" font-weight="700" fill="#1a1a1a">新しいテナント C　v1</text>
    <text x="393" y="144" font-size="11" fill="#5a6470">kek_id = k2026</text>
    <text x="393" y="162" font-size="11" fill="#5a6470">（k2026 で包んである）</text>
  </g>

  <!-- old server -->
  <g>
    <rect x="698" y="62" width="250" height="132" rx="10" fill="#eef2f7" stroke="#c8cdd4"/>
    <text x="714" y="88" font-size="13" font-weight="700" fill="#1a1a1a">まだ古い設定の台</text>
    <rect x="714" y="102" width="218" height="34" rx="6" fill="#f7f0e6" stroke="#d8c4a0"/>
    <text x="726" y="124" font-size="11" fill="#1a1a1a">KEYS：default</text>
    <rect x="714" y="144" width="218" height="34" rx="6" fill="#f7f0e6" stroke="#d8c4a0"/>
    <text x="726" y="166" font-size="11" fill="#1a1a1a">ACTIVE：default</text>
  </g>

  <!-- arrows -->
  <path d="M 282 128 L 363 128" stroke="#8a94a0" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="322" y="118" font-size="11" font-weight="700" text-anchor="middle" fill="#3a4450">① 作って保存</text>

  <path d="M 696 128 L 617 128" stroke="#b04a4a" stroke-width="2" fill="none" marker-end="url(#arrow-red)"/>
  <text x="656" y="118" font-size="11" font-weight="700" text-anchor="middle" fill="#8c2f2f">② 読む</text>

  <!-- failure -->
  <g>
    <rect x="698" y="214" width="250" height="56" rx="8" fill="#f7ecec" stroke="#d9a5a5"/>
    <text x="714" y="238" font-size="12" font-weight="700" fill="#8c2f2f">✕ k2026 を持っていないので開けない</text>
    <text x="714" y="256" font-size="11" fill="#8c2f2f">この台が受けた C の連携はすべて失敗する</text>
  </g>
  <line x1="823" y1="194" x2="823" y2="214" stroke="#d9a5a5" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- remedy -->
  <g>
    <rect x="32" y="214" width="583" height="88" rx="8" fill="#e6f2ea" stroke="#8fbfa3"/>
    <text x="48" y="238" font-size="12" font-weight="700" fill="#1f5c3d">だから 2 段階で替える</text>
    <text x="48" y="260" font-size="11" fill="#337050">1. k2026 を passive で全台に配る（どの台も k2026 で包んだ DEK を開ける状態にする）</text>
    <text x="48" y="280" font-size="11" fill="#337050">2. 全台に配り終えてから、k2026 を active にする</text>
  </g>
</svg>
