<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 350" width="980" height="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans JP', sans-serif">
  <title>DEK の新しい世代</title>
  <desc>テナントのデータ鍵の新しい世代を作ると、新しく書く行は新しい世代になり、古い世代は開くためだけに残る。古い世代の行はトークンを取り出したときに新しい世代へ移る</desc>

  <rect width="980" height="350" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a94a0"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f9a70"/>
    </marker>
  </defs>

  <!-- ── before ─────────────────────────────────────────── -->
  <text x="32" y="36" font-size="15" font-weight="700" fill="#1a1a1a">世代を作る前</text>
  <rect x="32" y="52" width="330" height="200" rx="10" fill="#f4f6f9" stroke="#c8cdd4"/>
  <g>
    <rect x="52" y="76" width="130" height="56" rx="8" fill="#eef2f7" stroke="#c8cdd4"/>
    <text x="117" y="100" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">v1</text>
    <text x="117" y="118" font-size="11" text-anchor="middle" fill="#5a6470">active</text>
  </g>
  <g>
    <rect x="216" y="76" width="126" height="56" rx="8" fill="#ffffff" stroke="#c8cdd4"/>
    <text x="279" y="100" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">連携の行</text>
    <text x="279" y="118" font-size="11" text-anchor="middle" fill="#5a6470">key = v1</text>
  </g>
  <path d="M 182 104 L 214 104" stroke="#8a94a0" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="52" y="168" font-size="11" fill="#5a6470">新しく書く行も、今ある行も v1</text>

  <!-- ── rotate ─────────────────────────────────────────── -->
  <path d="M 362 150 L 430 150" stroke="#8a94a0" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="396" y="138" font-size="11" font-weight="700" text-anchor="middle" fill="#3a4450">rotate</text>
  <text x="396" y="172" font-size="10" text-anchor="middle" fill="#5a6470">1 行足すだけ</text>

  <!-- ── after ──────────────────────────────────────────── -->
  <text x="432" y="36" font-size="15" font-weight="700" fill="#1a1a1a">世代を作った後</text>
  <rect x="432" y="52" width="516" height="200" rx="10" fill="#f4f6f9" stroke="#c8cdd4"/>
  <g>
    <rect x="452" y="76" width="130" height="56" rx="8" fill="#eef2f7" stroke="#c8cdd4"/>
    <text x="517" y="100" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">v2</text>
    <text x="517" y="118" font-size="11" text-anchor="middle" fill="#5a6470">active</text>
  </g>
  <g>
    <rect x="452" y="170" width="130" height="56" rx="8" fill="#eef2f7" stroke="#c8cdd4" stroke-dasharray="4 3"/>
    <text x="517" y="194" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">v1</text>
    <text x="517" y="212" font-size="11" text-anchor="middle" fill="#5a6470">passive：開くだけ</text>
  </g>
  <g>
    <rect x="616" y="76" width="160" height="56" rx="8" fill="#ffffff" stroke="#c8cdd4"/>
    <text x="696" y="100" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">新しく書く行</text>
    <text x="696" y="118" font-size="11" text-anchor="middle" fill="#5a6470">key = v2</text>
  </g>
  <g>
    <rect x="616" y="170" width="160" height="56" rx="8" fill="#ffffff" stroke="#c8cdd4"/>
    <text x="696" y="194" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">まだ読まれていない行</text>
    <text x="696" y="212" font-size="11" text-anchor="middle" fill="#5a6470">key = v1</text>
  </g>
  <path d="M 582 104 L 614 104" stroke="#8a94a0" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 582 198 L 614 198" stroke="#8a94a0" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <path d="M 776 198 C 860 198, 860 104, 780 104" stroke="#4f9a70" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow-green)"/>
  <text x="868" y="146" font-size="11" font-weight="700" fill="#1f5c3d">取り出した</text>
  <text x="868" y="162" font-size="11" font-weight="700" fill="#1f5c3d">ときに移る</text>

  <!-- ── notes ──────────────────────────────────────────── -->
  <rect x="32" y="270" width="916" height="62" rx="8" fill="#e6f2ea" stroke="#8fbfa3"/>
  <text x="48" y="290" font-size="11.5" font-weight="700" fill="#1f5c3d">一括で暗号化し直さない</text>
  <text x="48" y="306" font-size="10.5" fill="#337050">v1 で暗号化した行は、取り出されるか、期限が切れて消えるまで v1 のまま開ける。</text>
  <text x="48" y="322" font-size="10.5" fill="#337050">他の台は active な DEK を最大 60 秒キャッシュするので、その間は v1 で書くこともある（v1 も開けるので壊れない）。</text>
</svg>
