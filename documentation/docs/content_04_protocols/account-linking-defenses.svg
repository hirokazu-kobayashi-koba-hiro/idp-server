<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans JP', sans-serif">
  <title>外部IdPアカウント連携の防御層</title>
  <desc>連携フローの4フェーズと、乗っ取りの3つの向きが、どの検査で止まるかを示した図</desc>

  <rect width="980" height="560" fill="#ffffff"/>

  <!-- ── flow lane ───────────────────────────────────────── -->
  <text x="32" y="42" font-size="15" font-weight="700" fill="#1a1a1a">連携フロー</text>

  <line x1="32" y1="106" x2="948" y2="106" stroke="#c8cdd4" stroke-width="2"/>

  <!-- phase boxes -->
  <g>
    <rect x="32" y="62" width="176" height="88" rx="8" fill="#eef2f7" stroke="#c8cdd4"/>
    <text x="120" y="88" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">POST /link</text>
    <text x="120" y="110" font-size="11" text-anchor="middle" fill="#5a6470">Bearer</text>
    <text x="120" y="130" font-size="11" text-anchor="middle" fill="#5a6470">user を state に束縛</text>
  </g>
  <g>
    <rect x="248" y="62" width="176" height="88" rx="8" fill="#eef2f7" stroke="#c8cdd4"/>
    <text x="336" y="88" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">/linking/start</text>
    <text x="336" y="110" font-size="11" text-anchor="middle" fill="#5a6470">ブラウザ遷移</text>
    <text x="336" y="130" font-size="11" text-anchor="middle" fill="#5a6470">binding cookie を発行</text>
  </g>
  <g>
    <rect x="464" y="62" width="176" height="88" rx="8" fill="#f7f0e6" stroke="#d8c4a0"/>
    <text x="552" y="88" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">外部IdP</text>
    <text x="552" y="110" font-size="11" text-anchor="middle" fill="#5a6470">ログイン・同意</text>
    <text x="552" y="130" font-size="11" text-anchor="middle" fill="#5a6470">code を返す</text>
  </g>
  <g>
    <rect x="680" y="62" width="130" height="88" rx="8" fill="#eef2f7" stroke="#c8cdd4"/>
    <text x="745" y="88" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">callback</text>
    <text x="745" y="110" font-size="11" text-anchor="middle" fill="#5a6470">認証なし</text>
    <text x="745" y="130" font-size="11" text-anchor="middle" fill="#5a6470">park のみ</text>
  </g>
  <g>
    <rect x="850" y="62" width="98" height="88" rx="8" fill="#eef2f7" stroke="#c8cdd4"/>
    <text x="899" y="88" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">complete</text>
    <text x="899" y="110" font-size="11" text-anchor="middle" fill="#5a6470">Bearer</text>
    <text x="899" y="130" font-size="11" text-anchor="middle" fill="#5a6470">確定</text>
  </g>

  <!-- ── defense badges ──────────────────────────────────── -->
  <text x="32" y="196" font-size="15" font-weight="700" fill="#1a1a1a">検査</text>

  <g>
    <rect x="248" y="212" width="176" height="62" rx="8" fill="#e6f2ea" stroke="#8fbfa3"/>
    <text x="336" y="234" font-size="12" font-weight="700" text-anchor="middle" fill="#1f5c3d">B  操作者の照合</text>
    <text x="336" y="253" font-size="10.5" text-anchor="middle" fill="#337050">踏んでいるのは本人か</text>
    <text x="336" y="268" font-size="10.5" text-anchor="middle" fill="#337050">OP セッション / step-up</text>
  </g>
  <g>
    <rect x="680" y="212" width="130" height="62" rx="8" fill="#e6f2ea" stroke="#8fbfa3"/>
    <text x="745" y="234" font-size="12" font-weight="700" text-anchor="middle" fill="#1f5c3d">C  ブラウザ束縛</text>
    <text x="745" y="253" font-size="10.5" text-anchor="middle" fill="#337050">戻ったのは start を</text>
    <text x="745" y="268" font-size="10.5" text-anchor="middle" fill="#337050">踏んだブラウザか</text>
  </g>
  <g>
    <rect x="850" y="212" width="98" height="62" rx="8" fill="#e6f2ea" stroke="#8fbfa3"/>
    <text x="899" y="234" font-size="12" font-weight="700" text-anchor="middle" fill="#1f5c3d">A  Bearer 照合</text>
    <text x="899" y="253" font-size="10.5" text-anchor="middle" fill="#337050">確定するのは</text>
    <text x="899" y="268" font-size="10.5" text-anchor="middle" fill="#337050">束縛された本人か</text>
  </g>

  <line x1="336" y1="150" x2="336" y2="212" stroke="#8fbfa3" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="745" y1="150" x2="745" y2="212" stroke="#8fbfa3" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="899" y1="150" x2="899" y2="212" stroke="#8fbfa3" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- ── attacks ─────────────────────────────────────────── -->
  <text x="32" y="330" font-size="15" font-weight="700" fill="#1a1a1a">乗っ取りの向き</text>
  <text x="32" y="350" font-size="11" fill="#5a6470">攻撃者が被害者に渡すもの</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b04a4a"/>
    </marker>
  </defs>

  <!-- attack 1 -->
  <g>
    <rect x="32" y="368" width="300" height="52" rx="6" fill="#f7ecec" stroke="#d9a5a5"/>
    <text x="46" y="389" font-size="12" font-weight="700" fill="#8c2f2f">① 被害者の state を自分の Bearer で complete する</text>
    <text x="46" y="408" font-size="10.5" fill="#8c2f2f">被害者が park させたトークンを横取りする</text>
    <path d="M 332 394 L 500 394 L 500 300 L 890 300 L 890 282" stroke="#b04a4a" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <text x="600" y="292" font-size="11" font-weight="700" fill="#8c2f2f">A で止まる</text>
  </g>

  <!-- attack 2 -->
  <g>
    <rect x="32" y="434" width="300" height="52" rx="6" fill="#f7ecec" stroke="#d9a5a5"/>
    <text x="46" y="455" font-size="12" font-weight="700" fill="#8c2f2f">② 自分の start_url を被害者に踏ませる</text>
    <text x="46" y="474" font-size="10.5" fill="#8c2f2f">被害者に同意させ、自分のセッションに park させる</text>
    <path d="M 332 460 L 336 460 L 336 282" stroke="#b04a4a" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <text x="352" y="452" font-size="11" font-weight="700" fill="#8c2f2f">B で止まる</text>
  </g>

  <!-- attack 3 -->
  <g>
    <rect x="32" y="500" width="300" height="52" rx="6" fill="#f7ecec" stroke="#d9a5a5"/>
    <text x="46" y="521" font-size="12" font-weight="700" fill="#8c2f2f">③ 外部IdPの認可URLだけを被害者に渡す</text>
    <text x="46" y="540" font-size="10.5" fill="#8c2f2f">攻撃者は自分で start 通過済みなので B は評価されない</text>
    <path d="M 332 526 L 620 526 L 620 320 L 745 320 L 745 282" stroke="#b04a4a" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <text x="640" y="312" font-size="11" font-weight="700" fill="#8c2f2f">C で止まる</text>
  </g>

  <!-- note -->
  <text x="380" y="516" font-size="11" font-weight="700" fill="#1a1a1a">3つとも結果は同じ。被害者の外部アカウントが攻撃者に紐付く。</text>
  <text x="380" y="534" font-size="11" fill="#5a6470">違うのは「どこで止まるか」。② は B のみ、③ は C のみが止める。</text>
  <text x="380" y="550" font-size="11" fill="#5a6470">守る相手が違うため、3つの検査はどれも他で代替できない。</text>
</svg>
