openapi: 3.0.3
info:
  title: 外部アカウント連携 API
  version: 1.0.0
  description: |
    idp-server 独自の拡張。認証済みのユーザーが、自分のアカウントに外部IdPのアカウントを追加で紐付けます。
    紐付けの過程で外部IdPが発行したトークンを idp-server が暗号化して保管し、クライアントはあとでそのトークンを取り出して外部APIを呼べます。

    ## 流れ

    | # | 呼ぶもの | API | 認証 |
    |---|---|---|---|
    | 1 | RP | `POST /{tenant-id}/v1/me/linked-external-accounts/link/{provider}` | ユーザーのアクセストークン（`linked_account:manage`） |
    | 2 | ブラウザ（トップレベル遷移） | `GET /{tenant-id}/v1/linking/start` | なし（idp-server のブラウザセッション） |
    | 3 | ブラウザ（外部IdPから戻る） | `GET /{tenant-id}/v1/linking/callback/{provider}` | なし（2 で発行したブラウザ束縛の Cookie） |
    | 4 | RP | `POST /{tenant-id}/v1/me/linked-external-accounts/complete` | ユーザーのアクセストークン（`linked_account:manage`） |
    | 5 | クライアント | `POST /{tenant-id}/v1/linked-external-accounts/{alias}/token` | クライアント認証と、ユーザーのアクセストークン（`linked_account:read_token`） |

    連携の一覧と解除も、ユーザーのアクセストークンで呼びます。

    ## スコープ

    | スコープ | 使う API |
    |---|---|
    | `linked_account:read` | 一覧 |
    | `linked_account:manage` | 開始・確定・一覧・解除 |
    | `linked_account:read_token` | 保管トークンの取得。`read` / `manage` には含まれません |

    ## 送り手に縛られたアクセストークン

    ユーザーのアクセストークンを `Authorization` で送る API（開始・確定・一覧・解除）では、アクセストークンが送り手に縛られている場合はその形で送ります。
    DPoP で縛ったトークンは `Authorization: DPoP {access_token}` と、`DPoP` ヘッダーの proof（RFC 9449。`htu` は呼ぶ API の URL、`ath` はアクセストークンのハッシュ）で送ります。
    mTLS で縛ったトークンは、発行のときと同じクライアント証明書で接続します（RFC 8705）。
    クライアントインスタンスへの束縛（ABCA）は、これらの API では照合しません。クライアント認証を求めないためです。
    保管トークンの取得での照合は、その API の説明にあります。

    ## このページに無いもの

    - 利用者の連携の一覧・解除（管理者向け）: [ユーザー管理API](/docs/content_07_reference/cp-user-api-ja/)
    - 連携先の設定（`federation-configurations` の `type: account-linking`）: [フェデレーション設定管理API](/docs/content_07_reference/cp-federation-api-ja/)
    - 保管トークンを暗号化する鍵（用途 `account-linking-token`）: [テナント管理API](/docs/content_07_reference/cp-tenant-api-ja/)

    📘 [外部IdPアカウント連携](/docs/content_04_protocols/protocol-09-account-linking)
servers:
  - url: https://api.local.test
    description: IdP Server API エンドポイント(ローカル)

tags:
  - name: 連携する
    description: |
      連携の開始から確定まで（上の流れの 1〜4）。RP は 1 が返した `start_url` をブラウザのトップレベル遷移で開き、
      ブラウザが RP の戻り先に戻ってきたら 4 で確定します。2 と 3 はブラウザが開くもので、RP が直接呼ぶことはありません。
  - name: 連携の一覧と解除
    description: |
      ユーザー本人が、自分の連携を確かめ、解除します。
  - name: 保管トークンの取得
    description: |
      クライアントが、ユーザーに代わって連携先のアクセストークンを取り出します（上の流れの 5）。

paths:
  /{tenant-id}/v1/me/linked-external-accounts/link/{provider}:
    post:
      tags:
        - 連携する
      summary: 外部アカウント連携の開始
      description: |
        認証済みユーザーの外部IdPアカウント連携を開始します。アクセストークンのユーザーとクライアントを連携セッションに結び付け、
        ブラウザで開く `start_url` を返します。

        RP は `start_url` をブラウザの**トップレベル遷移**（`location.href` など）で開きます。iframe の中では連携は成立しません。
        以降のブラウザ遷移は、このページの `GET /v1/linking/start` と `GET /v1/linking/callback/{provider}` です。

        - `redirect_uri` は連携の終わりにブラウザを戻す先です。クライアント設定の `extension.linking_return_uris` と完全一致で照合します。
        - `redirect_uri` にはクエリを付けられます（戻すときに `&` でつなぎます）。フラグメント（`#...`）は付けないでください。戻すときのクエリがフラグメントの後ろに付き、RP が受け取れません。
        - 連携セッションの有効期間は 900 秒です（`expires_in`）。

        ブラウザは、成功すると `redirect_uri?linking=done&state=...`、失敗すると `redirect_uri?linking=failed&error=...` に戻ります。
        ただし、ブラウザがテナントのエラー画面で止まり、RP に戻らないこともあります（期限切れ・別のブラウザ・再読み込みなど）。
        `expires_in` を過ぎても戻らなければ、連携一覧で結果を確かめ、連携が無ければ失敗として扱ってください。

        ## 必要なスコープ
        `linked_account:manage`
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/LinkingProvider'
      security:
        - OAuth2:
            - linked_account:manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountLinkingStartRequest'
      responses:
        '201':
          description: 連携セッションを作成した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountLinkingStartResponse'
        '400':
          description: |
            次のいずれか。

            - `provider_unavailable` — `{provider}` の連携先が設定されていない、または運用者が無効にしている。利用者には、その連携先が今は使えないことを伝えます
            - `invalid_request` — `redirect_uri` が未指定、またはクライアントの `linking_return_uris` に登録されていない
            - `invalid_request` — `scope` が連携先の設定の `scopes_supported` の範囲を超えている
            - `invalid_request` — 連携先の `scopes_supported` に `openid` があるのに、`scope` に `openid` が無い

            `invalid_request` は RP の作りか設定の誤りで、`error_description` を見て直します。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountLinkingErrorResponse'
              examples:
                missing:
                  value:
                    error: invalid_request
                    error_description: "redirect_uri is required."
                not_registered:
                  value:
                    error: invalid_request
                    error_description: "redirect_uri is not registered for this client."
                provider_unavailable:
                  value:
                    error: provider_unavailable
                    error_description: "The linking provider is not configured or not enabled: example-idp"
                scope_beyond_provider:
                  value:
                    error: invalid_request
                    error_description: "The requested scope is not configured for this provider: calendar.write"
                openid_required:
                  value:
                    error: invalid_request
                    error_description: "The scope must include openid for this provider."
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            次のいずれか。

            - スコープ不足（`linked_account:manage` が必要）。`insufficient_scope` 形式
            - `{provider}` がクライアントの `linking_providers` に無い
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/InsufficientScopeError'
                  - $ref: '#/components/schemas/AccountLinkingErrorResponse'
              examples:
                insufficient_scope:
                  value:
                    error: insufficient_scope
                    error_description: "The request requires the 'linked_account:manage' scope."
                    scope: linked_account:manage
                provider_not_allowed:
                  value:
                    error: invalid_request
                    error_description: "The client may not start a link to this provider."
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

  /{tenant-id}/v1/linking/start:
    get:
      tags:
        - 連携する
      summary: 外部アカウント連携のブラウザ遷移（開始）
      description: |
        連携開始（`POST /v1/me/linked-external-accounts/link/{provider}`）が返した `start_url` です。
        RP はブラウザを**トップレベル遷移**でここへ送ります（iframe の中では成立しません）。

        idp-server のブラウザセッションから操作者を解決し、連携を開始したユーザーと一致するかを照合します。
        ブラウザセッションとして使うのは、ログインで発行した `__Host-IDP_BROWSER_{tenant-id}` Cookie が OP セッションと合うときだけです。合わなければセッションが無いのと同じに扱います。
        一致すれば、ブラウザ束縛の Cookie（`__Host-IDP_LINK_BINDING_{tenant-id}`、`Secure`・`Path=/`・`SameSite=Lax`）を発行し、外部IdPの認可エンドポイントへ `302` で送ります。

        Bearer は不要です。JSON は返さず、成功も失敗も `302` で答えます。

        ## 送り先

        | 状況 | `Location` |
        |---|---|
        | 操作者が一致した | 外部IdPの認可URL（`state`・`nonce`・`code_challenge`（`S256`）付き） |
        | ブラウザセッションが無い、ログインが `linking_max_auth_age` より古い、またはログインの acr がクライアントの `linking_acr_values` に当たらない（連携セッションは有効） | このサーバーの認可エンドポイント（`prompt=login`・`login_hint=sub:<連携を始めたユーザー>`、`linking_acr_values` があれば `acr_values`）。ログインが終わると認可コードを発行せずに `/linking/start?state=...&returned_from_sign_in=true` へ戻る（ログインを取り消した場合も同じ） |
        | ログインから戻ってもブラウザセッションが無い、ログインを取り消した、または acr が `linking_acr_values` に当たらない | `{redirect_uri}?linking=failed&error=login_required`（`state` は付けない） |
        | 操作者が一致しない | テナントのエラー画面（`error=access_denied`） |
        | `state` が無い・連携セッションが無い・期限切れ・開始済み（ブラウザセッションの有無に関わらず） | テナントのエラー画面（`error=invalid_request`） |
        | 連携を始めた後で、連携先の設定が削除・無効化された | テナントのエラー画面（`error=invalid_request`） |
        | その他のエラー | テナントのエラー画面（`error=server_error`） |

        ブラウザセッションが無い場合、連携セッションは消さずに残すので、サインインしたブラウザから同じ `start_url` で続けられます。

        ログインし直しは、連携を始めたクライアントの認可リクエストとして送ります（`client_id`、`redirect_uri` はクライアントの `redirect_uris` の先頭、`response_type=code`、`scope=openid`、PKCE）。
        そのため、このクライアントの認証ポリシーがこのログインにも当たります。クライアントに `redirect_uris` が無いと、テナントのエラー画面（`error=invalid_request`）になります。

        ## 認可画面を自分で作る場合

        同梱の認可画面はこの流れに対応しているので、RP がすることはありません。認可画面を自分で作る場合は、次のように扱います。

        - この認可リクエストには、カスタムパラメータ `idp_linking_state` が付いています。view-data の `custom_params.idp_linking_state` で見分けます
        - ログインが終わったら、同意画面は出さずに authorize（`POST /{tenant-id}/v1/authorizations/{id}/authorize`）を呼びます。応答の `redirect_uri` は `/{tenant-id}/v1/linking/start?state=...&returned_from_sign_in=true` で、画面はそこへ遷移するだけです。認可コードは発行しません。認可画面が別サイトにある構成では、ほかの認可と同じく `auth_proof` を受け取って `/complete` を経由し、そこから同じ URL へ戻ります
        - ログインを取り消すときは deny（`POST /{tenant-id}/v1/authorizations/{id}/deny`）を呼びます。応答の `redirect_uri` は同じ URL です
        - authorize-with-session（ログイン済みのセッションでの認可）は `400` `invalid_request` です。この認可リクエストは、ログインそのものを求めているためです

        ## RP に戻ってこない場合

        テナントのエラー画面へ送った場合、ブラウザは RP の戻り先に戻りません。RP は連携中の表示のまま待たず、
        連携開始の `expires_in`（900 秒）を過ぎたら、連携一覧（`GET /v1/me/linked-external-accounts`）で結果を確かめ、連携が無ければ失敗として扱ってください。
        エラー画面からやり直すときは、連携開始（`link`）から始めます。

        テナントのエラー画面は `{ui_config.base_url}/error/?error=...&error_description=...&tenant_id=...` です
        （`ui_config.base_url` が無い場合はテナントのドメイン）。`error_description` は失敗の種類ごとの固定文です。

        ## セキュリティイベント
        - `external_account_link_failed`（ブラウザセッションが無いだけの場合は記録しません）
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: state
          in: query
          required: true
          description: |
            連携開始レスポンスの `state`。`start_url` に含まれています。
            無い場合は、連携セッションが無いときと同じくテナントのエラー画面（`error=invalid_request`）へ送ります。
          schema:
            type: string
        - name: returned_from_sign_in
          in: query
          required: false
          description: |
            idp-server が送り出したログインし直しから戻るときに、idp-server が付ける（ログインを取り消した場合も付く）。
            認証の結果は表さない。これが `true` で、まだブラウザセッションが無い（または古い）ときは、
            もう一度ログインへは送らずに `login_required` を返す。RP が付ける必要はない。
          schema:
            type: string
            enum: ["true"]
      responses:
        '302':
          description: 外部IdPの認可エンドポイント、このサーバーの認可エンドポイント（ログインし直し）、RP の戻り先、またはテナントのエラー画面へリダイレクト
          headers:
            Location:
              description: 送り先（上の表を参照）
              schema:
                type: string
                format: uri
              examples:
                external_idp:
                  value: "https://idp.example.com/authorize?client_id=...&redirect_uri=...&response_type=code&state=...&nonce=...&scope=...&code_challenge=...&code_challenge_method=S256"
                login_required:
                  value: "https://rp.example.com/linking/callback?linking=failed&error=login_required"
                error_page:
                  value: "https://auth.example.com/error/?error=access_denied&error_description=...&tenant_id=67e7eae6-62b0-4500-9eff-87459f63fc66"
            Set-Cookie:
              description: 外部IdPへ送るときだけ、ブラウザ束縛の `__Host-IDP_LINK_BINDING_{tenant-id}` を発行します
              schema:
                type: string
        '500':
          $ref: '#/components/responses/InternalServerError'

  /{tenant-id}/v1/linking/callback/{provider}:
    get:
      tags:
        - 連携する
      summary: 外部アカウント連携のブラウザ遷移（コールバック）
      description: |
        外部IdPが認可応答を返す先です。連携先設定（`federation-configurations`）の `redirect_uri` にこの URL を登録します。

        `state` から連携セッションを引き、`/v1/linking/start` を通ったブラウザか（`__Host-IDP_LINK_BINDING_{tenant-id}` Cookie）を**認可コードを交換する前に**照合します。同じ名前の Cookie が 2 つ以上届いたときは照合に失敗します。
        照合できたら認可コードを交換し（PKCE）、ID Token の検証・userinfo の取得を経て、トークンを暗号化して連携セッションに預けます。
        **連携はまだ確定しません。** RP が戻り先で受け取った `state` で `POST /v1/me/linked-external-accounts/complete` を呼んで確定します。

        Bearer は不要です。JSON は返さず、成功も失敗も `302` で答えます。GET のみで、外部IdPの `response_mode=form_post` には対応していません。
        ブラウザ束縛の Cookie は結果に関わらず削除します。

        ## 送り先

        | 状況 | `Location` |
        |---|---|
        | トークンを預けた | `{redirect_uri}?linking=done&state=...` |
        | 外部IdPが `error` を返した | `{redirect_uri}?linking=failed&error=...&state=...` |
        | `code` も `error` も無い | `{redirect_uri}?linking=failed&error=server_error&state=...` |
        | トークン交換・ID Token の検証・userinfo の失敗、その他の想定外のエラー | `{redirect_uri}?linking=failed&error=server_error&state=...` |
        | `state` が無い・未知 | テナントのエラー画面（`error=invalid_request`） |
        | 連携セッションが期限切れ・コールバックを待つ状態でない（再読み込み・戻るボタン・二重送信） | テナントのエラー画面（`error=invalid_request`） |
        | ブラウザ束縛が無い・一致しない | テナントのエラー画面（`error=access_denied`） |

        戻り先へ返す `error` は `access_denied` / `temporarily_unavailable` / `server_error` のどれかです。
        外部IdPが付けてきた `error` は `access_denied` と `temporarily_unavailable` だけをそのまま使い、それ以外は `server_error` にします。
        `error_description` と外部IdPの応答本文は返しません。

        戻り先へ失敗を返したときは連携セッションを削除します。エラー画面へ送るときは、連携セッションに触れません。
        エラー画面へ送った場合はブラウザが RP に戻らないので、`/v1/linking/start` の「RP に戻ってこない場合」のとおり扱ってください。

        戻り先（`redirect_uri`）は連携開始のときにクライアントの `linking_return_uris` と完全一致で照合済みです。
        テナントのエラー画面の形は `/v1/linking/start` と同じです。

        ## セキュリティイベント
        - `external_account_link_failed`
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: provider
          in: path
          required: true
          description: |
            連携先の設定名（`sso_provider`）。連携先設定の `redirect_uri` と合わせるためのもので、
            処理には `state` から引いた連携セッションの連携先を使います。
          schema:
            type: string
            example: example-idp
        - name: code
          in: query
          required: false
          description: 外部IdPが発行した認可コード
          schema:
            type: string
        - name: state
          in: query
          required: false
          description: 外部IdPへ送った `state`（連携セッションの識別子）
          schema:
            type: string
        - name: error
          in: query
          required: false
          description: 外部IdPが返したエラーコード
          schema:
            type: string
        - name: error_description
          in: query
          required: false
          description: 外部IdPが返したエラーの説明。戻り先には渡しません
          schema:
            type: string
      responses:
        '302':
          description: RP の戻り先、またはテナントのエラー画面へリダイレクト
          headers:
            Location:
              description: 送り先（上の表を参照）
              schema:
                type: string
                format: uri
              examples:
                done:
                  value: "https://rp.example.com/linking/callback?linking=done&state=Xb3k...Qz"
                failed:
                  value: "https://rp.example.com/linking/callback?linking=failed&error=access_denied&state=Xb3k...Qz"
                error_page:
                  value: "https://auth.example.com/error/?error=invalid_request&error_description=...&tenant_id=67e7eae6-62b0-4500-9eff-87459f63fc66"
        '500':
          $ref: '#/components/responses/InternalServerError'

  /{tenant-id}/v1/me/linked-external-accounts/complete:
    post:
      tags:
        - 連携する
      summary: 外部アカウント連携の確定
      description: |
        コールバックで預けた外部IdPのトークンを、アクセストークンのユーザーの連携として確定します。
        ブラウザが `redirect_uri?linking=done&state=...` に戻ってきたら、その `state` を送ります。

        次の全てを満たすときだけ確定します。

        - `state` に対応する連携セッションがあり、期限内である
        - アクセストークンのクライアントが、連携を**開始したクライアント**と同じである（同じユーザーでも別のクライアントのトークンは `403`）
        - アクセストークンのユーザーが、連携を開始したユーザーと同じである
        - 連携セッションがコールバックまで進んでおり、まだ確定されていない

        同じユーザーが同じ外部アカウントをもう一度連携した場合はエラーにならず、既存の連携を更新します（`alias` は保たれます）。
        連携先が 1 件だけを許す（`multiple_accounts: false`、既定）ときは、外部アカウントを名乗らない連携先でも、もう一度の連携は既存の 1 件の更新になります。別の外部アカウントは `409` です。

        新しい連携も連携し直し（更新）も `201` で、応答の本文は同じ形です。見分けたいときは、確定の前の一覧に同じ `alias` があるかで判断します。

        ## 断られたときのやり直し
        `400` / `403` / `409` で断ったとき、連携セッションは確定を待つ状態のまま残ります。
        原因を取り除けば（例: 別のアカウントの連携を解除する）、期限内なら同じ `state` で送り直せます。
        `expired_link`・`invalid_link_state`（確定済み）と `404` のときは、連携開始（`link`）からやり直します。

        分岐には `error` を使ってください。`error_description` は人が読むための文で、変わることがあります。

        `state` が無いリクエストは、連携セッションが無いときと同じく `404` です。

        ## 連携し直しとトークン
        連携し直し（更新）では、保管トークンを新しいものに置き換えます。連携先が `revoke_on_relink: true` なら、置き換えた後で、入れ替わる前のトークンを外部IdPの失効エンドポイント（RFC 7009）で失効させます。
        外部IdPが同じ値を返したトークンは失効させません。失効はベストエフォートで、失敗しても確定は成功します。

        ## 必要なスコープ
        `linked_account:manage`

        ## セキュリティイベント
        - `external_account_linked` / `external_account_link_failed`
      parameters:
        - $ref: '#/components/parameters/TenantId'
      security:
        - OAuth2:
            - linked_account:manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - state
              properties:
                state:
                  type: string
                  description: 開始レスポンスの `state`（戻り先の `state` クエリと同じ値）
            example:
              state: "Xb3k...Qz"
      responses:
        '201':
          description: 連携を確定した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkedExternalAccount'
        '400':
          description: |
            次のいずれか。

            - `expired_link` — 連携セッションが期限切れ。連携開始（`link`）からやり直します
            - `provider_unavailable` — 連携を開始した後で、連携先の設定が削除・無効化された
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountLinkingErrorResponse'
              examples:
                expired_link:
                  value:
                    error: expired_link
                    error_description: "Account linking session is expired. state=..."
                provider_unavailable:
                  value:
                    error: provider_unavailable
                    error_description: "The linking provider is no longer available."
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            次のいずれか。

            - `insufficient_scope` — スコープ不足（`linked_account:manage` が必要）
            - `client_mismatch` — 連携を開始したクライアントと違うクライアントのトークン
            - `access_denied` — 連携を開始したユーザーと違うユーザーのトークン
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/InsufficientScopeError'
                  - $ref: '#/components/schemas/AccountLinkingErrorResponse'
              examples:
                insufficient_scope:
                  value:
                    error: insufficient_scope
                    error_description: "The request requires the 'linked_account:manage' scope."
                    scope: linked_account:manage
                client_mismatch:
                  value:
                    error: client_mismatch
                    error_description: "Account linking must be completed by the client that started it. state=..."
                access_denied:
                  value:
                    error: access_denied
                    error_description: "Account linking session is bound to a different user. state=..., provider=..."
        '404':
          description: |
            `state` に対応する連携セッションが無い。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountLinkingErrorResponse'
              example:
                error: not_found
                error_description: "Account linking session not found."
        '409':
          description: |
            次のいずれか。

            - `invalid_link_state` — 連携セッションが確定できる状態にない（コールバック前、または確定済み）
            - `account_already_linked` — 同じ外部アカウントが既に他のユーザーに紐付いている（連携先の `duplicate_link_policy` が `reject` のとき）。誰に紐付いているかは返しません
            - `another_account_linked` — この連携先の別のアカウントを既に連携している（連携先の `multiple_accounts` が `false` のとき）。先に解除してから連携します
            - `several_accounts_linked` — この連携先の連携が複数あり、どれを更新するか決められない（連携先が `multiple_accounts: true` だった間に作られた連携が残っているとき）。不要な連携を解除してから連携します
            - `invalid_request` — 同じユーザー・同じ連携先の確定が同時に届き、先に確定した方と重なった（連携先の `multiple_accounts` が `false` のとき）。一覧を引き直して結果を確かめます
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountLinkingErrorResponse'
              examples:
                invalid_link_state:
                  value:
                    error: invalid_link_state
                    error_description: "Account linking session is not awaiting completion."
                account_already_linked:
                  value:
                    error: account_already_linked
                    error_description: "This external account cannot be linked."
                another_account_linked:
                  value:
                    error: another_account_linked
                    error_description: "Another account of this provider is already linked. Unlink it before linking another."
                several_accounts_linked:
                  value:
                    error: several_accounts_linked
                    error_description: "Several accounts of this provider are linked. Unlink them before linking again."
                completed_at_once:
                  value:
                    error: invalid_request
                    error_description: "The request could not be completed due to a conflict with existing data."
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

  /{tenant-id}/v1/me/linked-external-accounts:
    get:
      tags:
        - 連携の一覧と解除
      summary: 外部アカウント連携の一覧
      description: |
        アクセストークンのユーザーの外部アカウント連携を一覧で返します。保管しているトークンは含みません。

        ページングはありません。ユーザーの連携を全件返します。連携先が `multiple_accounts: true` のときは、1 つの連携先に何件でも連携できるので、件数に応じて応答が大きくなります。

        ## 必要なスコープ
        `linked_account:read` または `linked_account:manage`
      parameters:
        - $ref: '#/components/parameters/TenantId'
      security:
        - OAuth2:
            - linked_account:read
        - OAuth2:
            - linked_account:manage
      responses:
        '200':
          description: 連携の一覧
          content:
            application/json:
              schema:
                type: object
                required:
                  - list
                properties:
                  list:
                    type: array
                    items:
                      $ref: '#/components/schemas/LinkedExternalAccount'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: スコープ不足（`linked_account:read` または `linked_account:manage` が必要）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsufficientScopeError'
              example:
                error: insufficient_scope
                error_description: "The request requires the 'linked_account:read' scope."
                scope: linked_account:read
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

  /{tenant-id}/v1/me/linked-external-accounts/{alias}:
    delete:
      tags:
        - 連携の一覧と解除
      summary: 外部アカウント連携の解除
      description: |
        アクセストークンのユーザーの連携を 1 件解除します。対象は呼び出したユーザー自身の連携だけで、他人の `alias` は `404` になります。

        行を消す前に、保管しているトークンを外部IdPの失効エンドポイント（RFC 7009）で失効させます。
        失効はベストエフォートで、`revocation_endpoint` が未設定・外部IdPに届かない・失効を拒否された場合も連携は解除されます。

        ## 必要なスコープ
        `linked_account:manage`

        ## セキュリティイベント
        - `external_account_unlinked`
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/LinkedAccountAlias'
      security:
        - OAuth2:
            - linked_account:manage
      responses:
        '204':
          description: 解除成功
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: スコープ不足（`linked_account:manage` が必要）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsufficientScopeError'
              example:
                error: insufficient_scope
                error_description: "The request requires the 'linked_account:manage' scope."
                scope: linked_account:manage
        '404':
          description: 指定した `alias` が呼び出したユーザーの連携に無い
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountLinkingErrorResponse'
              example:
                error: not_found
                error_description: "Linked external account not found."
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

  /{tenant-id}/v1/linked-external-accounts/{alias}/token:
    post:
      tags:
        - 保管トークンの取得
      summary: 保管トークンの取得
      description: |
        連携したアカウントの外部IdPアクセストークンを、クライアントがユーザーに代わって取り出します。
        ユーザーは `token`（そのユーザーのアクセストークン）で指定します。`Authorization` ヘッダーはクライアント認証が使うため、Bearer では送りません。

        次の全てを満たす場合だけトークンを返します。

        - クライアントが認証に成功している。public クライアント（`none`）は拒否します。`attest_jwt_client_auth`（ABCA）は使えます
        - `token` が有効なユーザーのアクセストークン（client_credentials で発行されたものでない）で、**認証したクライアントと同じクライアント**に発行され、`linked_account:read_token` スコープを持つ
        - `token` が sender-constrained なら、その送り手から出されている（DPoP は `DPoP` ヘッダーの proof、mTLS は同じクライアント証明書、クライアントインスタンス束縛はこのリクエストのクライアント認証で使われたインスタンスの鍵）
        - ユーザーが有効である
        - `alias` がそのユーザーの連携にある
        - 連携先がクライアントの `extension.linking_token_providers` に含まれている

        `token` は有効期限内でなければなりません（期限切れは `401` `invalid_token`）。ユーザーがその場にいない処理（バッチなど）で取り出すときは、
        クライアントが持つ idp-server のリフレッシュトークンで、先にユーザーのアクセストークンを取り直してください。

        返すのはアクセストークンだけで、リフレッシュトークンは返しません。
        アクセストークンの期限まで、連携先の `refresh_before_expiry_seconds`（既定 30 秒）を切っていれば、保管しているリフレッシュトークンで更新してから返します。
        同じ連携への同時リクエストは行ロックで待ち合わせ、リフレッシュトークンを二重に使いません。

        外部APIが期限前のトークンを `401` で断った（外部IdPで取り消された など）ときは、`force_refresh=true` を付けて取り直します。
        期限に関わらず更新して返します。更新できなければ `400` `relink_required` です。
        ほかのリクエストがロックを待つ間に更新を済ませていれば、もう一度は更新せずにそのトークンを返します。
        `force_refresh` は外部IdPを毎回呼ぶので、外部APIに断られたときだけ付けてください。

        ## クライアント認証

        トークンイントロスペクションと同じ方式でクライアントを認証します（`client_secret_basic` / `client_secret_post` /
        `client_secret_jwt` / `private_key_jwt` / `tls_client_auth` / `self_signed_tls_client_auth` / `attest_jwt_client_auth`）。
        クライアントは `Authorization` の Basic、`client_id`、Client Attestation の `sub` の順で特定します。

        クライアント認証の失敗は、方式に関わらず `401` `invalid_client` にまとめて返します。
        `attest_jwt_client_auth` 固有のエラーコードと `WWW-Authenticate` / `OAuth-Client-Attestation-Challenge` ヘッダーは返しません。

        ## セキュリティイベント
        - `external_account_token_retrieved` / `external_account_token_retrieval_failed`
        - `external_account_token_refreshed`（リフレッシュしたとき）
        - `external_account_relink_required`（`relink_required` のとき）
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/LinkedAccountAlias'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/OAuthClientAttestation'
        - $ref: '#/components/parameters/OAuthClientAttestationPop'
        - name: DPoP
          in: header
          required: false
          description: |
            `token` が DPoP で縛られているときに必須の DPoP proof（RFC 9449）。`htm` は `POST`、`htu` はこの API の URL、
            `ath` は `token` の SHA-256 ハッシュ（base64url）です。縛られていない `token` では送りません。2 つ以上送ると `400` `invalid_request` です。
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LinkedExternalAccountTokenRequest'
      responses:
        '200':
          description: 保管しているアクセストークン
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
            Pragma:
              schema:
                type: string
                example: no-cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkedExternalAccountTokenResponse'
        '400':
          description: |
            - `invalid_request` — `token` が無い / `force_refresh` が `true` でも `false` でもない / `DPoP` ヘッダーが 2 つ以上
            - `relink_required` — リフレッシュトークンが無い・期限切れ、または外部IdPがリフレッシュを 4xx（429 を除く）で拒否した。ユーザーが連携し直す必要があります
            - `provider_unavailable` — 連携先の設定が削除・無効化された。連携し直しも失敗するので、ユーザーには連携先が使えないことを伝えます
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkedExternalAccountTokenErrorResponse'
              examples:
                invalid_request:
                  value:
                    error: invalid_request
                    error_description: "token is required."
                relink_required:
                  value:
                    error: relink_required
                    error_description: "The stored token has expired and cannot be refreshed. Link the account again."
                provider_unavailable:
                  value:
                    error: provider_unavailable
                    error_description: "The linking provider is no longer available."
        '401':
          description: |
            - `invalid_client` — クライアント認証に失敗した / 未登録のクライアント / public クライアント
            - `invalid_token` — `token` が無効・期限切れ / ユーザーを指していない（client_credentials など） / ユーザーが有効でない / sender-constrained なのに送り手の証明が合わない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkedExternalAccountTokenErrorResponse'
              examples:
                invalid_client:
                  value:
                    error: invalid_client
                    error_description: "Client authentication failed."
                invalid_token:
                  value:
                    error: invalid_token
                    error_description: "token is invalid or expired."
        '403':
          description: |
            - `unauthorized_client` — `token` が別のクライアントに発行された / 連携先がクライアントの `linking_token_providers` に無い
            - `insufficient_scope` — `token` に `linked_account:read_token` が無い
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkedExternalAccountTokenErrorResponse'
              examples:
                unauthorized_client:
                  value:
                    error: unauthorized_client
                    error_description: "token was not issued to the authenticated client."
                insufficient_scope:
                  value:
                    error: insufficient_scope
                    error_description: "token does not carry linked_account:read_token."
        '404':
          description: "`not_found` — `alias` がユーザーの連携に無い。解除して別のアカウントをつなぎ直すと `alias` が変わるので、一覧（`GET /{tenant-id}/v1/me/linked-external-accounts`）を引き直す"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkedExternalAccountTokenErrorResponse'
              example:
                error: not_found
                error_description: "Linked external account not found."
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          description: "`temporarily_unavailable` — 外部IdPがリフレッシュに 5xx か 429 を返した、または到達できない。`Retry-After` は付きません。間隔を広げながら（指数バックオフ）再試行します"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkedExternalAccountTokenErrorResponse'
              example:
                error: temporarily_unavailable
                error_description: "The external identity provider could not refresh the token. Try again later."
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
components:
  responses:
    Unauthorized:
      description: |
        アクセストークンが無い・無効・期限切れ、送り手に縛られたトークンの証明（DPoP proof・クライアント証明書）が合わない、
        またはトークンのユーザーがもういない。`WWW-Authenticate`（`Bearer` か `DPoP`）にも同じ `error` を入れます。
      headers:
        WWW-Authenticate:
          schema:
            type: string
            example: 'Bearer error="invalid_token", error_description="..."'
      content:
        application/json:
          schema:
            type: object
            required:
              - error
              - error_description
            properties:
              error:
                type: string
                example: "invalid_token"
              error_description:
                type: string
                description: 理由を表す文。分岐には使わないでください
          example:
            error: "invalid_token"
            error_description: "The resource owner associated with the token no longer exists"
    TooManyRequests:
      description: |
        レート制限超過。

        クライアントが短時間に過剰なリクエストを送信した場合に返却されます。
        このレスポンスは API Gateway がリクエストをアプリケーションに到達させる前に返却します。

        `Retry-After` ヘッダーが含まれる場合は、指定された秒数後にリトライしてください。
      headers:
        Retry-After:
          schema:
            type: integer
          description: リトライまでの推奨待機時間（秒）
          required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                description: エラーメッセージ（optional。API Gateway の設定により含まれない場合があります）
          examples:
            throttled:
              summary: スロットリング（秒間リクエスト制限）
              value:
                message: "Too Many Requests"
            quota_exceeded:
              summary: クォータ超過（日次/月次リクエスト制限）
              value:
                message: "Limit Exceeded"
    InternalServerError:
      description: |
        サーバー内部エラー。

        アプリケーションで予期しないエラーが発生した場合、または API Gateway が
        バックエンドから正常なレスポンスを受信できなかった場合に返却されます。

        アプリケーション起因の場合は OAuth 2.0 ErrorResponse 形式
        （`{"error": "server_error", "error_description": "..."}`）で
        返却される場合があります。

        問題が継続する場合は、サーバー管理者にお問い合わせください。
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                description: エラーメッセージ（optional。API Gateway の設定により含まれない場合があります）
          examples:
            default:
              summary: サーバー内部エラー
              value:
                message: "Internal server error"
    ServiceUnavailable:
      description: |
        サービス一時利用不可。

        バックエンドサーバーが利用できない状態です。
        このレスポンスは API Gateway がバックエンドへの接続に失敗した場合に返却します。

        `Retry-After` ヘッダーが含まれる場合は、指定された秒数後にリトライしてください。
      headers:
        Retry-After:
          schema:
            type: integer
          description: サービス復旧までの推定時間（秒）
          required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                description: エラーメッセージ（optional。API Gateway の設定により含まれない場合があります）
          examples:
            default:
              summary: サービス利用不可
              value:
                message: "Service Unavailable"
    GatewayTimeout:
      description: |
        ゲートウェイタイムアウト。

        バックエンドサーバーからの応答が制限時間内に返却されませんでした。
        このレスポンスは API Gateway がバックエンドの応答を待機してタイムアウトした場合に返却します。

        ネットワークの一時的な問題の可能性があります。時間をおいてリトライしてください。
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                description: エラーメッセージ（optional。API Gateway の設定により含まれない場合があります）
          examples:
            default:
              summary: タイムアウト
              value:
                message: "Endpoint request timed out"

  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://api.local.test/{tenant-id}/v1/authorizations
          tokenUrl: https://api.local.test/{tenant-id}/v1/tokens
          scopes:
            linked_account:read: 外部アカウント連携の一覧に必要なスコープ
            linked_account:manage: 外部アカウント連携の開始・確定・解除に必要なスコープ。一覧も含む
            linked_account:read_token: 保管トークンの取得に必要なスコープ。`read` / `manage` には含まれない

  parameters:
    TenantId:
      name: tenant-id
      in: path
      required: true
      description: テナント識別子（UUID形式）
      schema:
        type: string
        format: uuid
        example: "67e7eae6-62b0-4500-9eff-87459f63fc66"

    LinkingProvider:
      name: provider
      in: path
      required: true
      description: "連携先の設定名。`federation-configurations` に `type: account-linking` で登録した設定の `sso_provider` です（ログイン用の `type: oidc` の設定は使いません）"
      schema:
        type: string
        example: example-idp
    LinkedAccountAlias:
      name: alias
      in: path
      required: true
      description: 連携の識別子（一覧の `alias`）
      schema:
        type: string
        example: example-idp-k3f9x2qa

    Authorization:
      name: Authorization
      in: header
      required: false
      description: |
        Basic認証ヘッダー（client_secret_basic認証方式用）。
        `Basic base64(client_id:client_secret)` 形式で送信します。
      schema:
        type: string

    OAuthClientAttestation:
      name: OAuth-Client-Attestation
      in: header
      required: false
      description: |
        Client Attestation JWT（`attest_jwt_client_auth` 用）。

        Client Attester が発行した JWT で、`cnf.jwk` にクライアントインスタンスの公開鍵を持ちます。
        `OAuth-Client-Attestation-PoP` と**必ず対で**送信します（片方だけのリクエストは拒否されます）。

        `typ` は `oauth-client-attestation+jwt`。
      schema:
        type: string
        format: jwt

    OAuthClientAttestationPop:
      name: OAuth-Client-Attestation-PoP
      in: header
      required: false
      description: |
        Client Attestation PoP JWT（`attest_jwt_client_auth` 用）。

        `OAuth-Client-Attestation` の `cnf.jwk` に対応する秘密鍵で署名し、そのインスタンスが
        鍵を保持していることを示します。`typ` は `oauth-client-attestation-pop+jwt`。

        テナントが `client_attestation_challenge_required` を有効にしている場合、
        `challenge` クレームに [チャレンジエンドポイント](/docs/content_07_reference/api-rp-ja/#tag/Client-Attestation) で得た値が必要です。
      schema:
        type: string
        format: jwt

  schemas:
    InsufficientScopeError:
      type: object
      properties:
        error:
          type: string
          example: insufficient_scope
        error_description:
          type: string
        scope:
          type: string
          description: 要求されるスコープ

    AccountLinkingStartRequest:
      type: object
      required:
        - redirect_uri
      properties:
        redirect_uri:
          type: string
          format: uri
          description: |
            連携の終わりにブラウザを戻す先。クライアント設定の `extension.linking_return_uris` と完全一致で照合します。
            認可の `redirect_uris` とは別の設定です。
          example: "https://rp.example.com/linking/callback"
        scope:
          type: string
          description: |
            外部IdPに要求するスコープ（スペース区切り）。省略すると連携先設定の `scopes_supported` を使います。
          example: "openid email offline_access"

    AccountLinkingStartResponse:
      type: object
      required:
        - start_url
        - state
        - expires_in
      properties:
        start_url:
          type: string
          format: uri
          description: |
            ブラウザをトップレベル遷移で開かせる URL。外部IdPではなく idp-server の `/v1/linking/start` です
            （認可サーバーの issuer から組み立てます）。
          example: "https://api.example.com/67e7eae6-62b0-4500-9eff-87459f63fc66/v1/linking/start?state=Xb3k...Qz"
        state:
          type: string
          description: 連携セッションの識別子。確定（`complete`）で送ります
        expires_in:
          type: integer
          description: 連携セッションの有効期間（秒）。固定で 900
          example: 900

    LinkedExternalAccount:
      type: object
      description: 外部アカウントの連携。保管しているトークンは含みません。
      required:
        - alias
        - provider
        - created_at
        - updated_at
      properties:
        alias:
          type: string
          description: |
            連携の識別子。`{provider}-{8 文字の乱数}` の形で、ユーザーの中で一意です。同じ外部アカウントを連携し直しても変わりません。解除した連携の識別子が別の連携に使い回されることはありません。
            解除して別のアカウントをつなぎ直すと新しい識別子になるので、前の識別子で取得すると `404` になります。そのときは一覧を引き直します。
            中身に意味を持たせない値として扱ってください。連携先は `-` で分けて取り出さず、`provider` を使います（連携先の名前に `-` が入ることがあります）。
          example: example-idp-k3f9x2qa
        provider:
          type: string
          description: 連携先の設定名（`sso_provider`）
          example: example-idp
        federated_username:
          type: string
          nullable: true
          description: |
            外部アカウントの表示名。同じ連携先を複数つないだとき、ユーザーが見分けるために使います。
            連携先設定の `userinfo_mapping_rules` で `preferred_username` にマッピングした値、無ければ `email` にマッピングした値です。
            連携先に userinfo（`userinfo_endpoint` / `userinfo_execution`）が無い場合や、どちらへのマッピングも無い場合は `null`
          example: user@example.com
        scope:
          type: string
          nullable: true
          description: |
            外部IdPが許可したスコープ。トークン応答に `scope` が無い場合は、外部IdPに要求したスコープ（RFC 6749 §5.1 で、要求どおりなら省略できるため）。
            要求したスコープは `link` の `scope`、省略したときは連携先設定の `scopes_supported`。リフレッシュの応答が `scope` を返せば、その値に置き換えます
          example: "openid email offline_access"
        access_token_expires_at:
          type: string
          nullable: true
          description: 保管しているアクセストークンの有効期限（タイムゾーンなしの ISO 8601 ローカル日時）
          example: "2026-10-21T11:15:30.123456"
        refresh_token_expires_at:
          type: string
          nullable: true
          description: |
            保管しているリフレッシュトークンの有効期限（同上）。リフレッシュトークンが無い場合は `null`
          example: "2026-10-22T10:15:30.123456"
        created_at:
          type: string
          description: 作成日時（同上）
          example: "2026-10-21T10:15:30.123456"
        updated_at:
          type: string
          description: 更新日時（同上）
          example: "2026-10-21T10:15:30.123456"

    AccountLinkingErrorResponse:
      type: object
      required:
        - error
        - error_description
      properties:
        error:
          type: string
          description: |
            エラーコード。連携先が使えないときは `provider_unavailable`（開始・確定）。確定（`complete`）は理由ごとのコード（`expired_link` / `provider_unavailable` / `client_mismatch` / `access_denied` /
            `invalid_link_state` / `account_already_linked` / `another_account_linked` / `several_accounts_linked`）、
            `404` は `not_found`、想定外のエラーは `server_error`、それ以外は `invalid_request`
          example: invalid_request
        error_description:
          type: string

    LinkedExternalAccountTokenRequest:
      type: object
      description: |
        保管トークンの取得リクエスト。クライアント認証のパラメータは、トークンイントロスペクションと同じです。
      required:
        - token
      properties:
        token:
          type: string
          description: |
            トークンを取り出すユーザーのアクセストークン。`linked_account:read_token` スコープを持ち、
            このリクエストで認証するクライアントに発行されたものに限ります。
        force_refresh:
          type: string
          enum: [ "true", "false" ]
          default: "false"
          description: |
            `true` なら、保管しているアクセストークンを期限に関わらず更新してから返します。
            外部APIが期限前のトークンを断ったときに使います。
        client_id:
          type: string
          description: |
            クライアント識別子。client_secret_post認証やmTLS認証で使用します。
            client_secret_basic認証の場合はAuthorizationヘッダで送信されるため省略可能。
        client_secret:
          type: string
          description: |
            クライアントシークレット。client_secret_post認証でのみ使用します。
            client_secret_basic認証の場合はAuthorizationヘッダで送信されます。
        client_assertion_type:
          type: string
          enum: [ "urn:ietf:params:oauth:client-assertion-type:jwt-bearer" ]
          description: |
            JWT認証（client_secret_jwt / private_key_jwt）で使用するアサーションタイプ。
            固定値: urn:ietf:params:oauth:client-assertion-type:jwt-bearer
        client_assertion:
          type: string
          description: |
            JWT認証で使用する署名済みJWTアサーション。
            client_secret_jwt: client_secretで署名
            private_key_jwt: 登録済み秘密鍵で署名

    LinkedExternalAccountTokenResponse:
      type: object
      required:
        - access_token
        - token_type
        - issued_token_type
      properties:
        access_token:
          type: string
          description: 外部IdPが発行したアクセストークン（保管していたもの、またはリフレッシュで更新したもの）
        token_type:
          type: string
          enum: [ Bearer ]
        issued_token_type:
          type: string
          enum: [ "urn:ietf:params:oauth:token-type:access_token" ]
        expires_in:
          type: integer
          minimum: 0
          description: アクセストークンの残り有効期間（秒）。有効期限を保管していない場合は含みません
          example: 3599
        scope:
          type: string
          description: |
            外部IdPが許可したスコープ。保管していない場合は含みません。
            外部IdPのトークン応答に `scope` が無かった場合は、外部IdPに要求したスコープ（`link` の `scope`、省略時は連携先設定の `scopes_supported`）です。
            リフレッシュの応答が `scope` を返せば、その値に置き換わります
          example: "openid email offline_access"
      example:
        access_token: "ya29.a0Af..."
        token_type: Bearer
        issued_token_type: "urn:ietf:params:oauth:token-type:access_token"
        expires_in: 3599
        scope: "openid email offline_access"

    LinkedExternalAccountTokenErrorResponse:
      type: object
      required:
        - error
        - error_description
      properties:
        error:
          type: string
          enum: [ invalid_request, relink_required, provider_unavailable, invalid_client, invalid_token, unauthorized_client, insufficient_scope, not_found, temporarily_unavailable ]
        error_description:
          type: string
          description: エラーの詳細な説明（ユーザー向けではない）
