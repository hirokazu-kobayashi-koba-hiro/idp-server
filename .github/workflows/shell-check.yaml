name: Shell check

# シェルスクリプトの shebang を検査する。
#   - zsh は Linux コンテナや CI イメージに入っていないことが多く、その環境で実行できない
#   - 既存の shebang 分布は bash が大多数のため、bash に統一する
on:
  pull_request:
    paths:
      # '**/*.sh' はパターン中の '/' がリテラル要求になり、リポジトリ直下の
      # setup.sh 等にマッチしない。全階層を対象にするため '**.sh' を使う。
      - '**.sh'
      - '.github/workflows/shell-check.yaml'
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  shebang:
    name: Reject zsh shebang
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Check shebang
        run: |
          found=0
          while IFS= read -r file; do
            # shebang 行だけを見る。1行目に zsh の語が出るコメントは違反にしない
            case "$(head -n 1 "$file")" in
              '#!'*zsh*)
                echo "::error file=${file},line=1::zsh shebang is not allowed. Use '#!/bin/bash' instead."
                found=1
                ;;
            esac
          done < <(git ls-files '*.sh')

          if [ "$found" -ne 0 ]; then
            exit 1
          fi
          echo "OK: no zsh shebang"
